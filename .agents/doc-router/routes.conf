# 編集しようとしているパスを統べている文書の対応表。
#
# 書式は 1 行 1 件、`<glob> = <文書> # <なぜその文書か>`。`#` で始まる行と空行は読み飛ばす。
# glob は `case` のパターンとして解釈され、リポジトリルート相対のパスに当てる。
#
# **足すときの制約は 2 つ**（理由は [README](../README.md)）。**間違ったエントリを書かない** ——
# 存在しない文書や、そのパスを統べていない文書を指すと、読み手はそれ 1 本で足りたと判断する
# （指し先の実在は `scripts/doc-router.gate.test.ts` が見る）。**最近接の README は載せない** ——
# 上へ辿れば出てくるものは表に置かない。

# --- 起動と境界の口（層の README からは導出できない） ---
src/proxy.ts = docs/adr/0043-middleware-policy.md # matcher が選ぶ経路と選ばない経路の両方が約束
src/instrumentation.ts = docs/adr/0030-environment-variable-management.md # 設定の検証がサーバ起動時に走る 2 つめの地点
next.config.ts = docs/adr/0111-csp-security-headers.md # 応答ヘッダと CSP の既定の口

# --- app 層の要素（要素ごとに持ち主が違う） ---
src/app/*/layout.tsx = docs/adr/0026-layout-shell-mount.md # Provider の載せ方。落ちても build は通る
src/app/*/route.ts = docs/adr/0071-bff-api-integration.md # 上流の失敗を正規化して返す約束
src/features/*/actions.ts = docs/adr/0061-form-mutation-ux.md # 送信の正規機構

# --- adapters の分割 ---
src/adapters/server/* = docs/adr/0024-adapters-server-client-split.md # server 側に client hook を混ぜない
src/adapters/client/* = docs/adr/0024-adapters-server-client-split.md # client 側から server 専用を辿らせない

# --- 生成物と契約 ---
src/adapters/gen/* = docs/adr/0072-api-type-generation.md # 手で編集しない。契約から生成し直す
mocks/api/* = docs/adr/0072-api-type-generation.md # 手で編集しない。契約から生成し直す

# --- 設定と環境 ---
src/config/* = docs/adr/0030-environment-variable-management.md # NEXT_PUBLIC_ の境界と秘密の置き場
env/* = docs/adr/0030-environment-variable-management.md # 環境ごとの合成と型付き loader
mise.toml = docs/adr/0003-version-manager.md # ここが SSOT。配送層へ延ばさない
package.json = docs/adr/0004-library-management.md # 中核依存は完全固定。major は別 PR

# --- 見た目 ---
tokens/* = docs/adr/0051-styling-system.md # トークンと帯の決め方
src/components/* = docs/adr/0052-ui-component-policy.md # icon の vendor は 1 ファイルへ閉じる
*.stories.tsx = docs/adr/0054-ui-catalog-storybook.md # カタログの方針

# --- 検査と自動化 ---
*.test.ts = docs/testing-conventions.md # 書き方の規約はここが持つ
*.test.tsx = docs/testing-conventions.md # 書き方の規約はここが持つ
playwright*.config.ts = docs/adr/0091-test-verification-methods.md # 何をどの手段で確かめるかの割り当て
scripts/* = docs/adr/0159-script-structure.md # 1 道具 1 ディレクトリ。入口と判定を分け、export と test を 1:1 にする
.makefiles/* = .makefiles/README.md # 目録はここが持つ。ターゲットの粒度と ai- 付きの捕捉もここ
.github/workflows/* = docs/adr/0153-ci-configuration.md # SHA 固定・最小権限・コメントは英語
.claude/skills/* = docs/adr/0154-claude-skills-operations.md # 置き場・命名・frontmatter・確認要件
.claude/agents/* = docs/adr/0155-claude-skills-development.md # subagent を置いてよい理由の一覧

# --- 文書そのもの ---
docs/adr/* = docs/adr/0140-documentation-operations.md # v1.0.0 未満は日本語が canonical
docs/spec/* = docs/adr/0143-spec-driven-development.md # 画面要件を仕様書として持つ
docs/rules.md = docs/README.md # 何がこの文書へ来て何が来ないかの判定。節を増やす前に読む
