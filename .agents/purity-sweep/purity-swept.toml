# 純化パスの台帳。どのファイルが走査を通ったかだけを覚えている。
#
# スキーマ:
#   [pending] "<リポジトリ相対パス>" = "<止まっている理由>"
#   [swept]   "<リポジトリ相対パス>" = "<YYYY-MM-DD>"
#
# 鍵は必ず引用符で囲んで書く。purity-swept.sh は TOML をパースせず、表の見出しを追いながら
# 行頭一致で引くため、この綴りが引きの前提そのものになっている。
#
# [swept] を最後に置いてあるのは、追記が常に末尾へ行われるからである。[pending] を後ろに
# 置くと、走査を終えた記帳が保留の表へ落ちる。
#
# 記帳するのは、そのファイルの全体を見終えてからにする。していない走査を主張するエントリは、
# エントリが無いことより悪い —— そのファイルはもう二度と見られない。

[pending]

[swept]
".agents/README.md" = "2026-09-06"
".agents/purity-sweep/purity-sweep.prompt" = "2026-09-06"
".agents/purity-sweep/purity-swept.sh" = "2026-09-06"
".agents/purity-sweep/purity-swept.toml" = "2026-09-06"
