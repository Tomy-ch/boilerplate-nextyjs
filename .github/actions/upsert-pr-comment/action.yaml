name: Upsert PR comment
description: Detect an existing comment by marker and update / create it (PR comment upsert)

inputs:
  github-token:
    required: true
    description: Token used to post the comment; must post as a bot (GITHUB_TOKEN or a GitHub App token), because the existing comment is matched on a bot author
  marker:
    required: true
    description: HTML comment marker used to detect the same comment
  status:
    required: false
    default: ""
    description: >-
      呼び出し元の判定。`success` だけがコメントの新規作成を抑止し、それ以外の値 —— 空文字を含む
      —— は投稿する。既存コメントの更新は `success` でも行う（FAIL → PASS の直しで古い赤が
      残らない）
  body-file:
    required: true
    description: >-
      コメント本文として読むファイルのパス。存在しない場合はジョブが打ち切られたことを意味し、
      失敗も投稿もせずに戻る
  title:
    required: false
    default: ""
    description: Heading prepended to the body (optional)
  details-summary:
    required: false
    default: ""
    description: When set, the summary text used to fold the body into a details block. Folding and fencing are independent — see body-sanitized
  body-sanitized:
    required: false
    default: "false"
    description: >-
      Set to "true" only when the caller has already filtered every value in body-file to a
      character set that cannot produce markup or mentions (ADR 0153 §5). The body is then
      rendered as Markdown instead of fenced, so a table reads as a table. Leave it at the
      default for anything that passes tool output through unaltered — a linter or a compiler
      echoes source lines, and in a public repository those are the pull request author's to
      write.
  notes-file:
    required: false
    default: ""
    description: >-
      Path to a file rendered as Markdown after the body, outside the fold and outside the code
      block. For workflow-authored prose only — anything a pull request can influence belongs in
      body-file, which is fenced.
  max-length:
    required: false
    default: "45000"
    description: Maximum body length in characters (the excess is truncated)

runs:
  using: composite
  steps:
    - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      env:
        MARKER: ${{ inputs.marker }}
        STATUS: ${{ inputs.status }}
        BODY_FILE: ${{ inputs.body-file }}
        TITLE: ${{ inputs.title }}
        DETAILS_SUMMARY: ${{ inputs.details-summary }}
        BODY_SANITIZED: ${{ inputs.body-sanitized }}
        NOTES_FILE: ${{ inputs.notes-file }}
        MAX_LENGTH: ${{ inputs.max-length }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');

          const marker = process.env.MARKER;
          const status = process.env.STATUS || '';
          const bodyFile = process.env.BODY_FILE;
          const title = process.env.TITLE || '';
          const detailsSummary = process.env.DETAILS_SUMMARY || '';
          const bodySanitized = (process.env.BODY_SANITIZED || 'false') === 'true';
          const notesFile = process.env.NOTES_FILE || '';
          const maxLength = Number(process.env.MAX_LENGTH || '45000');

          const pr = context.payload.pull_request?.number;
          if (!pr) {
            core.setFailed('Not a PR context');
            return;
          }
          // 本文が無いことは、このステップの失敗ではなく**ジョブが打ち切られたこと**を意味する。
          // 打ち切られたジョブは本文を書くステップまで到達しない。ここで失敗させると、投稿ステップ
          // だけが赤くなる。
          //
          // **何も投稿せずに戻る。**打ち切られたことはチェック一覧が既に示しており、コメントは
          // それを言い換えるだけである。加えて費用の形が悪い —— 打ち切りは判定を持たないため
          // 下の抑止を通り抜けて必ず書き込みを起こし、それが出る状況（ジョブの中断）は push が
          // 連続している状況と重なる。API の枠が一番苦しいときに消費が跳ねることになる。
          if (!fs.existsSync(bodyFile)) {
            core.warning(`${bodyFile} not found; the job was cut off. Nothing to post.`);
            return;
          }

          let content = fs.readFileSync(bodyFile, 'utf8').trimEnd();
          if (content.length > maxLength) {
            content = content.slice(0, maxLength) + '\n... (truncated)';
          }

          const updatedAtJST = new Date().toLocaleString('ja-JP', {
            timeZone: 'Asia/Tokyo',
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
          });

          const headSha =
            (context.payload.pull_request?.head?.sha)
            || process.env.GITHUB_SHA
            || context.sha;
          const shortSha = headSha.slice(0, 7);

          const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
          const commitUrl = `${repoUrl}/commit/${headSha}`;
          const commitLine = `🔖 Commit: [\`${shortSha}\`](${commitUrl})`;
          const updatedLine = `🕒 UpdatedAt: ${updatedAtJST} (JST)`;

          // 本文を固定の 3 連バッククォートで囲むと、本文自身がそのフェンスを閉じうる。
          // linter やコンパイラはソース行をそのまま出力するため、この中身は PR 提出者が
          // 制御できる — フェンスが破れた以降は生の Markdown としてレンダリングされ、
          // 第三者へ通知が飛ぶ mention や偽の見出し・リンクが CI bot の名義で載る。
          // 本文中の最長のバッククォート連より 1 本長いフェンスで囲めば、本文中のどの連も
          // それを閉じられない。
          const fenceFor = (text) => {
            const longestRun = (text.match(/`+/g) || [])
              .reduce((max, run) => Math.max(max, run.length), 0);
            return '`'.repeat(Math.max(3, longestRun + 1));
          };

          // 囲むかどうかを決めるのは、折り畳むかどうかではなく**未加工かどうか**である。
          // 呼び出し元が値を濾してから組み立てた本文は、表なら表として読めたほうがよい
          // （0153 §5 の「許可した集合は markup も mention も作れない」）。濾していない本文は、
          // 折り畳もうと折り畳むまいと囲む。
          const rendered = bodySanitized
            ? content
            : [fenceFor(content), content, fenceFor(content)].join('\n');
          const main = detailsSummary
            ? [`<details><summary>${detailsSummary}</summary>`, '', rendered, '', '</details>'].join('\n')
            : rendered;

          // 添える散文はフェンスへ入れない。フェンスの中身は Markdown として描画されないので、
          // 表も、コピーさせたいコマンドのブロックも、そこでは字面のまま出てしまう。
          // 入れてよいのはワークフローが書いた文だけである — 呼び出し元が本文と分けて渡す。
          let notes = '';
          if (notesFile) {
            if (!fs.existsSync(notesFile)) {
              core.setFailed(`${notesFile} not found`);
              return;
            }
            notes = fs.readFileSync(notesFile, 'utf8').trimEnd();
          }

          const heading = title;

          const parts = [marker];
          if (heading) parts.push(heading, '');
          parts.push(main);
          if (notes) parts.push('', notes);
          parts.push('', commitLine, '', updatedLine);
          const body = parts.join('\n');

          const comments = await github.paginate(github.rest.issues.listComments, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: pr,
            per_page: 100,
          });

          // 2 つの条件はそれぞれ別の経路を塞ぐ。public リポジトリではマーカー入りのコメントを
          // 誰でも投稿できるので、第三者のコメントを更新対象から外すには投稿者が bot である
          // ことが要る。一方その投稿者条件だけでは、本リポジトリのワークフローがすべて同じ bot
          // で投稿するため兄弟ワークフロー間を区別できない — 別のワークフローのマーカーを
          // ログへ出力させれば、そのワークフローを誤ったコメントへ誘導できる。このアクションが
          // 書いた本文は必ずマーカーで始まり、仕込まれた側はそうならない。
          const existing = comments.find(
            c => (c.body || '').startsWith(marker) && c.user?.type === 'Bot',
          );

          // `success` が抑止するのは**新規作成だけ**で、更新は抑止しない。直した PR が自分の赤い
          // コメントをその場で上書きできなくなるためである。
          const quiet = status === 'success';

          if (!existing && quiet) {
            core.info(`status=success and no existing ${marker} comment; nothing to post`);
            return;
          }

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              body,
            });
          }
