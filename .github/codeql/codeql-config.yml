name: 'CodeQL config'

# security-extended は誤検出の増加と引き換えに再現率を取る。init のステップではなくここで
# 宣言するのは、走らせる suite を 1 箇所で言うため。
queries:
  - uses: security-extended

paths-ignore:
  # 依存。その脆弱性は依存スキャンの subject であって SAST のものではない。
  - '**/node_modules'
  # API 契約からの生成物。書き手が居ないので、ここの所見は直せない —— 直す先は契約か生成器である。
  - src/adapters/gen
  - mocks/api
  # ドキュメントビューアーのビルド出力。解析するのは TypeScript のソースの側。
  - '**/dist'
