name: 'CodeQL config'

# security-extended trades a higher false-positive rate for recall. Declared here
# rather than on the init step so the suite is stated in one place.
queries:
  - uses: security-extended

paths-ignore:
  # Dependencies. Their own advisories are the dependency scan's subject, not SAST's.
  - '**/node_modules'
  # Generated from the API contract. Nobody edits them, so a finding here
  # is not actionable — it belongs upstream in the contract or the generator.
  - src/adapters/gen
  - mocks/api
  # Build output of the docs viewer; its TypeScript sources are analyzed instead.
  - '**/dist'
