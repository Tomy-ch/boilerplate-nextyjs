name: Accessibility

# Runs axe over every Storybook story in a real browser, inside the same
# digest-pinned container the screenshots use — the automated a11y check rides on the
# stories, and no additional runner is introduced for it (see the README).
#
# Real browser is the point. The component suite's `vitest-axe` runs under jsdom,
# which has no layout and no computed colour, so `color-contrast` is switched off
# there — see the `rules: { "color-contrast": { enabled: false } }` scattered through
# `src/**`. Here both themes are actually painted, so contrast violations that only
# appear in dark mode are reachable.
#
# Kept out of `vrt.yaml` deliberately. An a11y failure landing in the VRT report
# would enter the retake set, and retaking a screenshot does not fix an a11y
# violation — it only marks the baseline as accepted.
#
# No baseline images are needed, so the submodule is not fetched.
#
# No `paths:` filter, deliberately — README.md says why every workflow runs on every PR. The
# job always starts and then asks two questions before it spends anything, so the context is
# reported even when the expensive steps stand down.
#
# ## Deferred, and the three layers below it
#
# The expensive steps stand down on an ordinary pull request; the cadence that replaces them
# is README.md § 先送りにする検査. Both questions this job asks have to say yes, and a third
# layer sits below them — the input hash `make a11y` computes. What each layer decides is in
# `vrt/README.md`.

on:
  pull_request:
    # Spelled out because naming `types` replaces the default set rather than adding to it,
    # and `labeled` is what lets `run-a11y` start a run on a pull request already open.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - production
      - staging
      - develop
      - 'release/**'
  schedule:
    # 18:00 UTC daily (03:00 JST), alongside the other deferred checks.
    - cron: '0 18 * * *'
  workflow_dispatch:

# Select the CI environment file (env/.env.ci).
env:
  APP_ENV: ci

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Only for the branch issue a failure off a pull request raises; the reporting of a
      # pull-request result stays in the `a11y-comment` job below.
      issues: write

    outputs:
      title: ${{ steps.a11y.outputs.title || steps.standdown.outputs.title }}
      # Standing down is a success for the comment: nothing is created on a quiet PR,
      # and an earlier FAIL comment is overwritten by the stand-down body instead of
      # being left beside a green check.
      status: ${{ steps.a11y.outputs.status || 'success' }}

    # A step's `if` cannot read `secrets`, only `env`. The app id is not a secret.
    env:
      BASELINE_APP_ID: ${{ secrets.BASELINE_APP_ID }}

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            prod.app-api.stepsecurity.io:443
            mise-versions.jdx.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            fonts.googleapis.com:443
            fonts.gstatic.com:443
            mcr.microsoft.com:443
            *.data.mcr.microsoft.com:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Decide whether this event has to run axe now
        id: trigger
        uses: ./.github/actions/check-trigger
        with:
          label: run-a11y
          labels: ${{ toJSON(github.event.pull_request.labels.*.name) }}

      # Only asked once the cadence says this event pays. Identical to VRT's list, and
      # identical for the same reason: axe reads the rendered page, so anything a story
      # renders from decides a violation. Why the two keep their own copy instead of a
      # shared default is in README.md.
      - name: Decide whether the diff can reach a story
        id: scope
        if: steps.trigger.outputs.run == 'true'
        uses: ./.github/actions/diff-scope
        with:
          base-ref: ${{ github.base_ref }}
          ignore: |
            docs/*
            *.md
            .claude/*
            .agents/*
            .cursor/*
            .gemini/*

      - name: Setup mise and the pinned tools
        if: steps.scope.outputs.relevant == 'true'
        uses: ./.github/actions/setup-mise
        with:
          tools: core:node aqua:pnpm/pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        if: steps.scope.outputs.relevant == 'true'
        uses: ./.github/actions/setup-deps
      - name: Restore the last verified input state
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/a11y/verified-inputs.sha256
          key: a11y-verified-${{ github.run_id }}
          restore-keys: a11y-verified-

      - name: Build Storybook and run axe over every story
        id: a11y
        if: steps.scope.outputs.relevant == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set +e

          # The run is entirely CPU-bound (axe evaluates in-page, one story at a time per
          # worker), so it asks for every core instead of Playwright's default half. The
          # percentage form is deliberate: a core count is a fact about the runner, not
          # about this project, and a standard runner has four cores on a public repository
          # but two on a private one — which is what a repository created from this template
          # gets.
          # Streamed for the same reason as `vrt.yaml`: a cancelled or timed-out run must
          # still leave a log behind, stamped with the runner's clock.
          make a11y VRT_ARGS=--workers=100% 2>&1 | tee /tmp/a11y-full.log
          code=${PIPESTATUS[0]}

          if [ "${code}" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            # Green because axe ran, or green because the inputs had already cleared it —
            # the reader needs to be able to tell those apart.
            if grep -qx 'vrt-gate: skip' /tmp/a11y-full.log; then
              echo "title=## ✅ Accessibility: PASS (inputs unchanged, axe skipped)" >> "$GITHUB_OUTPUT"
            else
              echo "title=## ✅ Accessibility: PASS (axe on every story)" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ❌ Accessibility: FAIL" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      # Only a clean run is worth carrying forward. The key is unique per run so the save
      # always lands; `restore-keys` above then picks up the newest one.
      - name: Save the verified input state
        if: steps.a11y.outputs.status == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/a11y/verified-inputs.sha256
          key: a11y-verified-${{ github.run_id }}

      # A job that stood down still owes the pull request a verdict (README § PR コメント,
      # the `diff-scope` bullet). The body file is the one the comment job reads, so it has
      # to be written here too.
      - name: Note that axe did not run
        id: standdown
        if: steps.scope.outputs.relevant != 'true'
        shell: bash
        env:
          # Compared in the shell rather than interpolated into it. Why the two stand-down
          # reasons stay distinguishable: README.md, "降りた理由は 2 つあり、書き分ける".
          DEFERRED: ${{ steps.trigger.outputs.run != 'true' }}
        run: |
          if [ "${DEFERRED}" = "true" ]; then
            echo 'title=## ⏭️ Accessibility: SKIP (deferred to the merge and the nightly pass)' >> "$GITHUB_OUTPUT"
            cat <<'NOTE' > /tmp/a11y-full.log
          全 story への axe は、保護ブランチへの merge と日次で回ります。この PR では実行していません。

          この PR で回すなら `run-a11y` ラベルを付けてください。`develop` / `staging` / `production`
          を base とする PR では、ラベルの有無に関わらず必ず回ります。
          NOTE
          else
            echo 'title=## ⏭️ Accessibility: SKIP (diff cannot reach a story)' >> "$GITHUB_OUTPUT"
            echo 'この PR の差分は story に届かないため、axe を実行していません。' > /tmp/a11y-full.log
          fi

      - name: Upload the axe report
        if: always() && steps.a11y.outputs.status == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: a11y-report
          path: tmp/vrt
          retention-days: 7
          if-no-files-found: warn

      - name: Hand the comment body to the commenting job
        if: always() && github.event_name == 'pull_request' && (steps.a11y.outputs.status != '' || steps.standdown.outcome == 'success')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: a11y-comment
          path: /tmp/a11y-full.log
          retention-days: 1
          if-no-files-found: error

      # One issue per branch, reopened rather than duplicated — README.md,
      # "PR の外で落ちたら、issue にする".
      #
      # This is what the deferred cadence costs. A violation now lands and is found after the
      # merge, so the finding has to arrive somewhere a human looks rather than in a run nobody
      # opened.
      - name: Compose what the issue says
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.scope.outputs.relevant == 'true' && steps.a11y.outputs.status != 'success' }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # The evidence is the JSON report Playwright wrote, not the tail of the log: it
          # already separates the stories that failed from the ones that passed, and it
          # carries how many of how many — which the last 80 lines cannot say
          # (`scripts/test-report`). The tail is passed alongside and is used only
          # where the report cannot decide — a run that died before writing one.
          #
          # Handed over as `authored`: the body is this repository's prose, and axe's own text
          # — rule ids and help prose this repository does not author — sits inside a fence
          # sized to its own content, so it cannot become markup.
          tail -n 200 /tmp/a11y-full.log > /tmp/a11y-full.tail 2>/dev/null || : > /tmp/a11y-full.tail
          pnpm exec tsx scripts/test-report \
            tmp/vrt/report.json /tmp/a11y-full.tail /tmp/a11y-evidence.txt ||
            cat <<'FALLBACK' > /tmp/a11y-evidence.txt
          （違反の一覧を組み立てられませんでした。実行ログと `a11y-report` artifact を見てください。）
          FALLBACK

          cat <<'NOTE' > /tmp/a11y-note.md
          `a11y-report` artifact に、story ごとの違反が入っています。

          手元で確かめるなら `make a11y` です。特定の story だけなら
          `make a11y VRT_ARGS="--grep <story 名>"`。

          **rule を切って通さないでください。** 切ってよいのは jsdom に無い前提（layout / 配色）へ
          依存する rule を component 側の suite で外すときだけで、ここは実ブラウザなのでその理由は
          立ちません (ADR 0100)。
          NOTE

          # Degrades to a fixed body rather than failing: the step that raises the issue does
          # not gate on this one, so a failure here would file an empty issue (README.md,
          # "PR の外で落ちたら、issue にする").
          pnpm exec tsx scripts/ci-report issue-body \
            --heading '違反の詳細:' \
            --kind authored \
            --evidence /tmp/a11y-evidence.txt \
            --run-url "${RUN_URL}" \
            --note /tmp/a11y-note.md > /tmp/a11y-guard.md ||
            printf '%s\n\n実行: %s\n' '❌ 本文を組み立てられませんでした。実行ログを読んでください。' "${RUN_URL}" > /tmp/a11y-guard.md

      # Minted rather than using `GITHUB_TOKEN` for its rate limit; falls back when the app
      # is absent (README § PR コメント).
      - name: Mint a token for the issue
        id: api-token
        if: env.BASELINE_APP_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BASELINE_APP_ID }}
          private-key: ${{ secrets.BASELINE_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-contents: read

      - name: Raise it where it has an owner
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.scope.outputs.relevant == 'true' && steps.a11y.outputs.status != 'success' }}
        uses: ./.github/actions/upsert-issue
        with:
          github-token: ${{ steps.api-token.outputs.token || secrets.GITHUB_TOKEN }}
          title: '[Accessibility] ${{ github.ref_name }} で axe が違反を報告している'
          body-file: /tmp/a11y-guard.md
          label: bug

      # `status` is empty when the run stood down, which is not a failure. The scope guard
      # has to be repeated here rather than left to `status`, because "no verdict" and "a bad
      # verdict" read the same to the expression below.
      - name: Fail if a story has a violation
        if: always() && steps.scope.outputs.relevant == 'true' && steps.a11y.outputs.status != 'success'
        run: exit 1

  # Holds no secret beyond `GITHUB_TOKEN`, matching how `vrt.yaml` splits reporting
  # from the job that produces the body.
  a11y-comment:
    if: always() && github.event_name == 'pull_request'
    needs: a11y
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            prod.app-api.stepsecurity.io:443
            mise-versions.jdx.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            fonts.googleapis.com:443
            fonts.gstatic.com:443
            mcr.microsoft.com:443
            *.data.mcr.microsoft.com:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download the comment body
        id: body
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: a11y-comment
          path: /tmp/a11y-comment

      - name: Comment the accessibility result on PR
        if: steps.body.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- a11y-result -->'
          status: ${{ needs.a11y.outputs.status }}
          title: ${{ needs.a11y.outputs.title }}
          body-file: /tmp/a11y-comment/a11y-full.log
          details-summary: 'axe log'
