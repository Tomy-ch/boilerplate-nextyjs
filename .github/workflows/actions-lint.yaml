name: Actions Lint

# Lints the Actions definitions themselves — the same commands the pre-commit hook
# runs. Seven checks, one concern:
#
#   actionlint          — workflow syntax, plus the shell of every `run:` in
#                         `.github/workflows`. shellcheck is installed alongside it
#                         because actionlint shells out to it; on a runner without it
#                         the shell checks are silently skipped rather than reported.
#   actions-shellcheck  — the shell of every `run:` in a composite action. actionlint
#                         scans only `.github/workflows` and rejects an `action.yaml`
#                         handed to it directly (it reads the file as a workflow), so
#                         without this the shells under `.github/actions` reach no gate
#                         at all.
#   actions-comment-…   — no secret reaches a job that posts a PR comment. Secret
#     …secret-lint        masking only covers what the runner captures for the log, so
#                         bytes written to a file with `tee` pass through unmasked and
#                         land verbatim in a public comment. actionlint cannot express
#                         that rule, so it is checked here.
#   actions-mise-pin-…  — the mise version, its digest and the cache key agree. mise's
#     …lint               own version cannot live in `mise.toml`, so it is declared in
#                         `.github/actions/setup-mise` in three places at once.
#   actions-required-…  — every context the ruleset marks required is reported on every
#     …check-lint         pull request. A required context that is never reported blocks
#                         the merge forever, and the reasons it goes unreported (a job
#                         renamed, two jobs sharing a name, a `paths:` filter) span two
#                         files at once, which actionlint never reads together.
#   actions-zizmor      — static analysis of the definitions themselves. Neither of the two
#                         above can see quoting inside `${{ … }}`; the README has why.
#                         zizmor reads the expressions and gates on high findings only.
#   shellcheck          — every tracked standalone `*.sh`. What lives there is shell
#                         only because it has to run before dependencies are installed
#                         (the exception the README records). Nothing else covers it: it is
#                         not TypeScript, so neither the 1:1 gate nor coverage applies,
#                         and it sits outside `.github` so actionlint and
#                         actions-shellcheck both miss it.
#
# All of them are reported through a single PR comment: they answer the same question
# — is the automation we are about to execute correct — and splitting them would add
# further required checks for one concern.
#
# No `paths:` filter, deliberately — README.md says why every workflow runs on every PR.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actions-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            prod.app-api.stepsecurity.io:443
            mise-versions.jdx.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            tuf-repo-cdn.sigstore.dev:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup mise and the pinned tools
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:rhysd/actionlint aqua:koalaman/shellcheck aqua:zizmorcore/zizmor core:node aqua:pnpm/pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        uses: ./.github/actions/setup-deps
      - name: Run Actions lint
        id: actions-lint
        shell: bash
        run: |
          set +e

          # One list, one place: a check is added here and nowhere else. The verdict, the log
          # and the title are all derived from this array, so a check cannot be half-added —
          # the shape that reports green while failing.
          checks=(
            'actionlint|actionlint'
            'actions-shellcheck|shellcheck'
            'actions-comment-secret-lint|pr-comment secret lint'
            'actions-mise-pin-lint|mise pin'
            'actions-required-check-lint|required check'
            'actions-zizmor|zizmor'
            'shellcheck|script shellcheck'
            'egress-check|egress'
          )

          status=success
          names=''
          : > /tmp/actions-lint.log

          for check in "${checks[@]}"; do
            # Appended in order, because the log is what the pull-request comment shows.
            make "${check%%|*}" 2>&1 | tee -a /tmp/actions-lint.log
            [ "${PIPESTATUS[0]}" -eq 0 ] || status=failure

            names="${names:+${names} + }${check#*|}"
          done

          echo "status=${status}" >> "$GITHUB_OUTPUT"

          if [ "${status}" = 'success' ]; then
            echo "title=## ✅ Actions lint: PASS (${names})" >> "$GITHUB_OUTPUT"
          else
            echo "title=## ❌ Actions lint: FAIL (${names})" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      - name: Comment actions lint result on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- actions-lint-result -->'
          status: ${{ steps.actions-lint.outputs.status }}
          title: ${{ steps.actions-lint.outputs.title }}
          body-file: /tmp/actions-lint.log
          details-summary: 'Actions lint log'

      - name: Fail if the Actions lint failed
        if: always() && steps.actions-lint.outputs.status != 'success'
        run: exit 1
