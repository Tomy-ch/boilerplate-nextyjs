name: Actions Pin

# Verifies every `uses:` is pinned to the commit SHA recorded in
# `.github/actions-pin.toml` — the same command the pre-commit hook runs
# (hooks mirror CI). A moving tag lets upstream change what CI executes without a
# commit here, so an unpinned or drifted reference fails the PR.
#
# The check never reaches the network: it compares the workflow files against the
# lockfile. Resolving tags to SHAs (the step that does call out) is a deliberate
# local action — `make actions-pin-resolve` — and is not run in CI.
#
# A separate workflow from `actions-lint` on purpose: actionlint validates workflow
# syntax, this validates supply-chain provenance (one concern per
# workflow).
#
# No `paths:` filter, deliberately — README.md says why every workflow runs on every PR.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actions-pin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            prod.app-api.stepsecurity.io:443
            mise-versions.jdx.dev:443
            nodejs.org:443
            registry.npmjs.org:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup mise and the pinned tools
        uses: ./.github/actions/setup-mise
        with:
          tools: core:node aqua:pnpm/pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        uses: ./.github/actions/setup-deps

      - name: Run actions-pin check
        id: actions-pin
        shell: bash
        run: |
          set +e

          make actions-pin-check 2>&1 | tee /tmp/actions-pin.log
          code=${PIPESTATUS[0]}

          if [ "${code}" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ Actions pin: PASS (SHA pinned)" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ❌ Actions pin: FAIL (unpinned or drifted)" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      - name: Comment actions pin result on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- actions-pin-result -->'
          status: ${{ steps.actions-pin.outputs.status }}
          title: ${{ steps.actions-pin.outputs.title }}
          body-file: /tmp/actions-pin.log
          details-summary: 'actions-pin log'

      - name: Fail if the pin check failed
        if: always() && steps.actions-pin.outputs.status != 'success'
        run: exit 1
