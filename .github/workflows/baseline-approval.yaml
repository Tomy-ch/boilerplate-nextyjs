name: Baseline Approval

# Requires a human to accept the pixels when a pull request moves the baseline images.
# Why the acceptance is a label rather than a pull-request review is in
# docs/design/vrt.md; what the person is expected to do is in vrt/README.md.
#
# The label's presence is not enough: it has to have been applied AFTER the commit that
# last moved the pointer, or it accepted different images. Deriving that from timestamps
# rather than from a label-removal step keeps the guard where the removal cannot run —
# a fork's token is read-only.
#
# No `paths:` filter, deliberately — README.md says why every workflow runs on every PR.

on:
  pull_request:
    # `labeled` is what lets the check turn green without a new push. `unlabeled` is the
    # other direction: withdrawing an acceptance has to re-run the check, or the last
    # green verdict would stand over a pull request whose acceptance is gone. Only a
    # person reaches this trigger — the retake leaves `baseline-approve` alone
    # (`baseline-retake.yaml`).
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline-approval:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read

    # A step's `if` cannot read `secrets`, only `env`. The app id is not a secret.
    env:
      BASELINE_APP_ID: ${{ secrets.BASELINE_APP_ID }}

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            prod.app-api.stepsecurity.io:443
            mise-versions.jdx.dev:443
            nodejs.org:443
            registry.npmjs.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decide whether the baselines moved
        id: moved
        env:
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags --depth=1 origin "${BASE_REF}" >/dev/null 2>&1 || true

          # Two commits, not `...` — the shallow-checkout reason `actions/diff-scope` gives.
          # Not being able to answer means asking for the label.
          if ! changed="$(git diff --name-only "origin/${BASE_REF}" HEAD -- baseline/images 2>/dev/null)"; then
            echo 'moved=true' >> "$GITHUB_OUTPUT"
            echo '::notice::Could not diff the pointer; asking for the label.'
            exit 0
          fi

          if [ -z "${changed}" ]; then
            echo 'moved=false' >> "$GITHUB_OUTPUT"
          else
            echo 'moved=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Note that there is nothing to accept
        if: steps.moved.outputs.moved == 'false'
        run: echo '基準画像は動いていません。' >> "$GITHUB_STEP_SUMMARY"

      # Minted rather than using `GITHUB_TOKEN` for its rate limit; falls back when the app
      # is absent (README § PR コメント).
      - name: Mint a token for the API calls
        id: api-token
        if: steps.moved.outputs.moved == 'true' && env.BASELINE_APP_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BASELINE_APP_ID }}
          private-key: ${{ secrets.BASELINE_APP_PRIVATE_KEY }}
          permission-pull-requests: read
          permission-issues: read
          permission-contents: read

      # The label alone is not the gate: an acceptance given before the current images
      # existed accepted something else. The pointer's own commit date is the line.
      #
      # Looked for on this pull request AND on the one that introduced the pointer commit:
      # what is kept is that a human looked at THESE pixels, not which pull request they
      # were looking at. Resolved from the commit, so it survives any branch naming.
      - name: Require an acceptance newer than the baselines
        if: steps.moved.outputs.moved == 'true'
        env:
          GH_TOKEN: ${{ steps.api-token.outputs.token || secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          pointer="$(gh api "repos/${GITHUB_REPOSITORY}/commits?path=baseline/images&sha=${HEAD_SHA}&per_page=1" \
            --jq '.[0] // empty')"
          taken="$(jq -r '.commit.committer.date // empty' <<<"${pointer}")"

          if [ -z "${taken}" ]; then
            echo '❌ 基準画像を動かしたコミットを特定できませんでした。' >&2
            exit 1
          fi

          # Latest across the pull requests that could carry one, so the comparison below
          # has a single value regardless of where the acceptance was given.
          latest_acceptance() {
            for number in "$@"; do
              [ -n "${number}" ] || continue
              gh api "repos/${GITHUB_REPOSITORY}/issues/${number}/events?per_page=100" --paginate \
                --jq '.[] | select(.event == "labeled" and .label.name == "baseline-approve") | .created_at'
            done | sort | tail -n 1
          }

          origin_pr="$(gh api "repos/${GITHUB_REPOSITORY}/commits/$(jq -r .sha <<<"${pointer}")/pulls" \
            --jq '.[0].number // empty')"
          accepted="$(latest_acceptance "${PR}" "${origin_pr}")"

          if [ -z "${accepted}" ]; then
            echo "❌ 基準画像が変わっています。撮り直しのコメントが並べた前後の絵で画素を確かめ、baseline-approve ラベルを付けてください。" >&2
            exit 1
          fi

          # ISO 8601 in UTC throughout, so a lexical comparison is a chronological one.
          if [[ "${accepted}" < "${taken}" ]]; then
            echo "❌ baseline-approve は今の基準画像より前に付いています(承認 ${accepted} / 撮影 ${taken})。付け直してください。" >&2
            exit 1
          fi

          echo "✅ ${accepted} に承認されています。" >> "$GITHUB_STEP_SUMMARY"
