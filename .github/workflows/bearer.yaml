name: Bearer Scan

# Bearer follows a value to the point where it leaves the process — a log line, an
# outbound request, a third-party client — and reports it against a classification of
# what the value is. Nothing else here asks that: opengrep judges a pattern
# or a taint path on its own terms, and neither knows that the string reaching a
# logger happens to be an email address.
#
# A FINDING never fails the job. Findings go to code scanning,
# and what turns a pull request red is GitHub's own check over the alerts the diff
# introduces.
#
# A BROKEN MECHANISM DOES fail it. Reporting is this job's entire output — there is no
# gate and no PR comment — so a scan that crashed, a SARIF that was never written, or
# an upload that did not land all produce the same green check as a clean run. That is
# the one failure mode a reporting-only job must not have: "not scanned" is
# indistinguishable from "nothing found". The distinction this job draws is the same
# one `dependency-scan` draws.
#
# It never fails because THE BASELINE IS NOT ZERO, and it cannot honestly be made
# zero. Paths whose placeholder secrets exist to be placeholders (fixtures, development
# helpers) are excluded in `.makefiles/security/bearer.mk`; what remains are findings on
# rules that also match harmless code, such as `observable_timing` on a comparison that
# involves no secret. Silencing such a rule would be a rule-wide disable, which
# the suppression rules forbid, so those stay visible instead.
#
# No `paths:` filter, deliberately — README.md says why every workflow runs on every PR.

on:
  pull_request:
  schedule:
    - cron: '15 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bearer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            prod.app-api.stepsecurity.io:443
            mise-versions.jdx.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            api.cycode.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # What cannot change this scan's answer — this job's own claim, not a shared default.
      # Bearer reads `src` alone (bearer.mk), so the catalog, the baselines and the
      # generated docs site cannot move its answer.
      - name: Decide whether the diff can reach this scan
        id: scope
        uses: ./.github/actions/diff-scope
        with:
          base-ref: ${{ github.base_ref }}
          ignore: |
            docs/*
            *.md
            .claude/*
            .agents/*
            .cursor/*
            .gemini/*
            vrt/*
            e2e/*
            .storybook/*
            docs-viewer/*
            tokens/*
            public/*
            *.stories.tsx
            *.test.ts
            *.test.tsx

      - name: Setup mise and the pinned tools
        if: steps.scope.outputs.relevant == 'true'
        uses: ./.github/actions/setup-mise
        with:
          # node and pnpm join bearer for `scripts/sarif` — see the note on the scan step.
          tools: core:node aqua:pnpm/pnpm aqua:Bearer/bearer
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        if: steps.scope.outputs.relevant == 'true'
        uses: ./.github/actions/setup-deps
      - name: Run the Bearer scan
        if: steps.scope.outputs.relevant == 'true'
        env:
          BEARER_SARIF_FILE: bearer.sarif
        run: make bearer-sarif

      # An empty or missing report means the scan produced nothing to report with.
      - name: Require the SARIF to exist
        if: steps.scope.outputs.relevant == 'true'
        run: test -s bearer.sarif

      # Not `continue-on-error`. Code scanning is where this job's output goes; if the
      # upload does not land, the job produced nothing.
      - name: Upload the SARIF to code scanning
        if: steps.scope.outputs.relevant == 'true'
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: bearer.sarif
          category: bearer

  # See README.md § 通知 (why only scheduled runs notify, and why cancelled counts).
  notify-failure:
    needs: bearer
    if: ${{ always() && github.event_name == 'schedule' && contains(fromJSON('["failure", "cancelled"]'), needs.bearer.result) }}
    uses: ./.github/workflows/notify.yaml
    with:
      failed-job: bearer
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
