name: Build

# next build, plus the checks that only the build artifact can answer. Nothing local
# mirrors this one: the pre-push hook stops at typecheck because a full build is too
# slow for a hook, so CI is the only place a broken build is caught.
#
# The render-mode check rides along because the artifact is already here. A page baked
# at build time type-checks, passes its tests, and keeps CI green while serving content
# that stopped being true — and baking it also demands the backend be reachable during
# the build, which the delivery boundary does not promise. Adding a second build to catch that would
# cost another ten minutes for a comparison a manifest already answers.
#
# No `paths:` filter, deliberately — README.md says why every workflow runs on every PR.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Select the CI environment file (env/.env.ci).
env:
  APP_ENV: ci

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            prod.app-api.stepsecurity.io:443
            mise-versions.jdx.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            fonts.googleapis.com:443
            fonts.gstatic.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise and the pinned tools
        uses: ./.github/actions/setup-mise
        with:
          tools: core:node aqua:pnpm/pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache the Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        uses: ./.github/actions/setup-deps

      - name: Run next build
        id: build
        shell: bash
        run: |
          set +e

          pnpm build 2>&1 | tee /tmp/build.log
          code=${PIPESTATUS[0]}

          if [ "${code}" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ Build: PASS (next build)" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ❌ Build: FAIL (next build)" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      # Only meaningful when the build produced an artifact. Its failure is reported
      # through the same comment, so the body file gets appended rather than replaced.
      - name: Check that every page renders in its declared mode
        id: render-mode
        if: steps.build.outputs.status == 'success'
        shell: bash
        run: |
          set +e

          pnpm render-mode 2>&1 | tee /tmp/render-mode.log
          code=${PIPESTATUS[0]}

          {
            echo ""
            echo "### 描画モード"
            echo ""
            cat /tmp/render-mode.log
          } >> /tmp/build.log

          if [ "${code}" -ne 0 ]; then
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ❌ Build: FAIL (render mode)" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      - name: Comment build result on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- build-result -->'
          status: ${{ steps.render-mode.outputs.status || steps.build.outputs.status }}
          title: ${{ steps.render-mode.outputs.title || steps.build.outputs.title }}
          body-file: /tmp/build.log
          details-summary: 'next build log'

      - name: Fail if the build or the render-mode check failed
        if: always() && (steps.build.outputs.status != 'success' || steps.render-mode.outputs.status == 'failure')
        run: exit 1
