name: CodeQL Scan

# SAST over the application's own source. It sees what the dependency
# scanners do not: a flaw this repository wrote, rather than one it pulled in.
#
# No matrix. This repository is one language, and a matrix would make the reported
# context name depend on the leg — a required check cannot be registered against a
# name that branches at run time.
#
# High-severity findings block the merge through code scanning's own required
# setting, not through this job's exit code. The job fails only when
# the analysis itself could not run.
#
# No `paths:` filter, deliberately — README.md says why every workflow runs on every PR.

on:
  pull_request:
  push:
    branches:
      - production
      - staging
      - develop
      - 'release/**'
  schedule:
    - cron: '15 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    runs-on: ubuntu-latest
    # 30, because `security-extended` runs longer than the default suite.
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            prod.app-api.stepsecurity.io:443
            mise-versions.jdx.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            uploads.github.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `build-mode: none` extracts straight from source. Saying so is required —
      # without it CodeQL looks for a build that this analysis does not need, and a
      # `next build` here would only add the framework's own output to the corpus.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: .github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: '/language:javascript-typescript'

  # See README.md § 通知 (why only scheduled runs notify, and why cancelled counts).
  notify-failure:
    needs: codeql
    if: ${{ always() && github.event_name == 'schedule' && contains(fromJSON('["failure", "cancelled"]'), needs.codeql.result) }}
    uses: ./.github/workflows/notify.yaml
    with:
      failed-job: codeql
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
