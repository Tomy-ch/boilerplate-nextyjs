name: Component Classes

# Tailwind emits nothing for a class it does not recognise, and nothing fails: the element simply
# renders without that declaration. A surface turns transparent, a focus ring disappears, a
# selected state stops being visible — silently, and only in the browser. Copy-in from the
# shadcn/ui registry is the usual way these classes arrive, because the upstream theme defines
# tokens this repository does not.
#
# The check compiles the real entry stylesheet and looks for every class written under
# src/components in the output. It is hermetic and caused by the change under review, so it gates
# pull requests.
#
# No `paths:` filter, deliberately — README.md says why every workflow runs on every PR.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  component-classes:
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            prod.app-api.stepsecurity.io:443
            mise-versions.jdx.dev:443
            nodejs.org:443
            registry.npmjs.org:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup mise and the pinned tools
        uses: ./.github/actions/setup-mise
        with:
          tools: core:node aqua:pnpm/pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        uses: ./.github/actions/setup-deps

      - name: Verify that every class written in a component produces CSS
        run: pnpm check:classes
