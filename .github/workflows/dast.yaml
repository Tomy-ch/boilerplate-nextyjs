name: DAST

# The only check here that reads a RESPONSE rather than a file. Every other scanner
# reads the tree; this one builds the app, boots it inside the runner, and drives HTTP
# at it with OWASP ZAP.
#
# It exists because a delivered header cannot be verified by reading the source. What
# `next.config.ts` declares and what a browser actually receives are two different
# facts, and only one of them protects anyone.
#
# THE GATE IS ON FROM DAY ONE, AND THE KNOWN GAPS ARE AN ENUMERATED LIST. Everything
# ZAP reports today sits in `.github/zap/rules.tsv` with a reason and a removal
# condition; anything NOT on that list turns this red. The list is what makes the
# wall passable — a permanently red required check would block the very pull requests
# that shrink it.
#
# The entries are IGNORE rather than removed, and ZAP still prints every ignored rule
# with its URLs in the summary. That is severity lowered, not a finding hidden
#.
#
# `zaproxy/action-baseline` is deliberately not used. Its `docker_name` input takes a
# tag, not a digest, and this repository pins every container image by digest and
# checks it with `make images-pin-check` — an action input is not in that
# scan's reach. Running the image through the same compose file the VRT container uses
# keeps the pin inside a mechanism that verifies it.
#
# Deliberately unfiltered by `paths`; the reason every workflow runs on every PR is
# in README.md.

on:
  pull_request:
  schedule:
    # ZAP's own rules and add-ons change while the code stands still.
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Select the CI environment file (env/.env.ci).
env:
  APP_ENV: ci

jobs:
  dast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            prod.app-api.stepsecurity.io:443
            mise-versions.jdx.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            fonts.googleapis.com:443
            fonts.gstatic.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            raw.githubusercontent.com:443
            cfu.zaproxy.org:443
            news.zaproxy.org:443
            tel.zaproxy.org:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # What cannot change this scan's answer. The list is the deny side on purpose: anything
      # not named here still runs, so a missing entry costs one needless run while a wrong
      # entry would leave a scanner reporting on nothing (see the note in the action).
      # DAST reads the delivered response. The catalog, the baselines and the test files
      # are not part of what `next build` serves; CSS and tokens are served but cannot
      # change a header or a status code, which is all this scan reads.
      - name: Decide whether the diff can reach this scan
        id: scope
        uses: ./.github/actions/diff-scope
        with:
          base-ref: ${{ github.base_ref }}
          ignore: |
            docs/*
            *.md
            .claude/*
            .agents/*
            .cursor/*
            .gemini/*
            vrt/*
            e2e/*
            .storybook/*
            docs-viewer/*
            tokens/*
            *.css
            *.stories.tsx
            *.test.ts
            *.test.tsx

      - name: Setup mise and the pinned tools
        if: steps.scope.outputs.relevant == 'true'
        uses: ./.github/actions/setup-mise
        with:
          tools: core:node aqua:pnpm/pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache the Next.js build cache
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        if: steps.scope.outputs.relevant == 'true'
        uses: ./.github/actions/setup-deps

      - name: Build
        if: steps.scope.outputs.relevant == 'true'
        run: pnpm build

      # The server is polled rather than slept at, and the process is checked for
      # liveness so a server that dies on startup is not mistaken for one still
      # booting — the same shape smoke.yaml uses, for the same reasons.
      - name: Start the server
        id: server
        if: steps.scope.outputs.relevant == 'true'
        shell: bash
        run: |
          set +e

          pnpm start > /tmp/dast-server.log 2>&1 &
          echo "pid=$!" >> "$GITHUB_OUTPUT"

          for _ in {1..60}; do
            if curl --fail --location --silent --show-error --max-time 5 http://127.0.0.1:3000/ > /dev/null; then
              echo "up=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 1
          done

          echo "up=false" >> "$GITHUB_OUTPUT"
          exit 0

      # A scan that never reached a running application is not a clean scan. The
      # verdict step below treats a missing status the same as a failing one.
      - name: Run the DAST gate
        id: dast
        if: steps.scope.outputs.relevant == 'true' && steps.server.outputs.up == 'true'
        shell: bash
        run: |
          set +e

          make dast 2>&1 | tee /tmp/dast.log
          code=${PIPESTATUS[0]}

          if [ "${code}" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ DAST: PASS (ZAP baseline)" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ❌ DAST: FAIL (ZAP baseline)" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      - name: Stop the server
        if: always() && steps.scope.outputs.relevant == 'true' && steps.server.outputs.pid != ''
        shell: bash
        env:
          SERVER_PID: ${{ steps.server.outputs.pid }}
        run: kill "${SERVER_PID}" 2>/dev/null || true

      - name: Report that the server never answered
        if: always() && steps.scope.outputs.relevant == 'true' && steps.server.outputs.up != 'true'
        shell: bash
        run: |
          {
            echo 'アプリが起動しなかったため、走査していません。'
            echo
            tail -50 /tmp/dast-server.log
          } > /tmp/dast.log

      - name: Upload the ZAP report
        if: always() && steps.scope.outputs.relevant == 'true' && hashFiles('tmp/dast/**') != ''
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dast-report
          path: tmp/dast

      # A job that stood down still owes the pull request a verdict; see sast.yaml. This also
      # keeps the body file present, so the comment below reports standing down rather than
      # the cut-off it would otherwise infer from a missing file.
      - name: Note that the diff cannot reach the delivered response
        id: standdown
        if: steps.scope.outputs.relevant != 'true'
        shell: bash
        run: |
          echo 'title=## ⏭️ DAST: SKIP (配信面に届かない差分)' >> "$GITHUB_OUTPUT"
          echo 'この PR の差分は配信される応答に届かないため、撃っていません。配信面そのものは週次で撃ちます。' > /tmp/dast.log

      - name: Comment DAST result on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- dast-result -->'
          status: ${{ steps.dast.outputs.status || (steps.standdown.outcome == 'success' && 'success') || '' }}
          title: "${{ steps.dast.outputs.title || steps.standdown.outputs.title || '## ⚠️ DAST: CUT OFF (the application never answered)' }}"
          body-file: /tmp/dast.log
          details-summary: 'ZAP log'

      - name: Fail if a new finding was reported
        if: always() && steps.scope.outputs.relevant == 'true' && steps.dast.outputs.status != 'success'
        run: exit 1

  # See README.md § 通知 (why only scheduled runs notify, and why cancelled counts).
  notify-failure:
    needs: dast
    if: ${{ always() && github.event_name == 'schedule' && contains(fromJSON('["failure", "cancelled"]'), needs.dast.result) }}
    uses: ./.github/workflows/notify.yaml
    with:
      failed-job: dast
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
