name: Dead Code

# Reports files, exports and dependencies that nothing reaches.
#
# This closes a gap the other gates cannot see. The 1:1 correspondence gate in Scripts Check
# asks whether an export has a matching `describe`, and the coverage thresholds ask whether
# its branches run — an export nobody calls satisfies both, because its own test is the
# caller. Only reachability from a real entry point separates "supported API" from
# "code that survived a refactor".
#
# The published surface is declared as entry points in `knip.ts`. A boilerplate exports the
# components a repository created from this template consumes, so "unused inside this
# repository" is the expected steady state there and is not a finding; everything else is
# internal and is.
#
# No `paths:` filter, deliberately — README.md says why every workflow runs on every PR.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dead-code:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            prod.app-api.stepsecurity.io:443
            mise-versions.jdx.dev:443
            nodejs.org:443
            registry.npmjs.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise and the pinned tools
        uses: ./.github/actions/setup-mise
        with:
          tools: core:node aqua:pnpm/pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        uses: ./.github/actions/setup-deps

      - name: Report unused files, exports and dependencies
        run: pnpm knip
