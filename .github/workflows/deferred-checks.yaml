name: Deferred Checks

# Names, on the pull request, which of the deferred checks its diff has earned.
#
# `a11y`, `e2e` and `lighthouse` do not run their expensive steps on an ordinary pull request.
# Each of them says so in its own result comment, which covers "did this check run?" — it does
# not cover "should I have made it run?", because each job sees the diff only through its own
# lens and none of them looks at the other two.
#
# So this workflow reads the diff once, for all three, and leaves at most one comment.
#
# ## This is not a gate
#
# It cannot fail, and it is not a required status check. What it produces is a prompt whose
# answer is a label. `scripts/deferred-checks/recommend.ts` holds which paths name which label
# and why; `volume.ts` holds the fallback that fires on size alone.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The changed-line count past which the comment appears when no label could be named from the
  # diff's structure. **There is no theoretical basis for 400** — crossing it costs a comment
  # and nothing else, so if it nags, raise it; if things land unchecked, lower it.
  ALERT_AT: '400'

jobs:
  deferred-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            prod.app-api.stepsecurity.io:443
            mise-versions.jdx.dev:443
            nodejs.org:443
            registry.npmjs.org:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # The base ref has to be resolvable to count anything; a shallow checkout leaves it a
          # bad object and the count would silently come out as zero — which reads exactly like
          # a small change.
          fetch-depth: 0

      # Asked without labels on purpose: a label forces one check, not three, and answering
      # "already forced" here would silence the other two. What is left for this step is the
      # all-or-nothing part — a promotion pull request runs everything.
      - name: Decide whether the checks are still deferred on this pull request
        id: cadence
        uses: ./.github/actions/check-trigger

      - name: Setup mise and the pinned tools
        if: steps.cadence.outputs.run != 'true'
        uses: ./.github/actions/setup-mise
        with:
          tools: core:node aqua:pnpm/pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        if: steps.cadence.outputs.run != 'true'
        uses: ./.github/actions/setup-deps

      - name: Decide what to say about the deferred checks
        id: nudge
        if: steps.cadence.outputs.run != 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: >-
          pnpm exec tsx scripts/deferred-checks nudge
          "origin/${BASE_REF}" "${ALERT_AT}" /tmp/deferred-checks-nudge.md

      - name: Comment the nudge on PR
        if: steps.nudge.outputs.comment == 'true'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- deferred-checks-nudge -->'
          title: ${{ steps.nudge.outputs.title }}
          body-file: /tmp/deferred-checks-nudge.md
          # Every cell comes from the declaration in `recommend.ts`, and the one computed value
          # is a line count. Nothing here is taken from the diff's own text.
          body-sanitized: 'true'
