name: Dependency Review

# BOILERPLATE-ONLY. This workflow is removed by `make setup-remove-boilerplate-only`,
# and it is declared in that script's manifest rather than marked in place, because a
# whole file cannot carry a marker that survives its own deletion.
#
# It is kept to this repository's own operation because the API it calls is free only
# on a public repository; on a private one it needs a GitHub Advanced Security (Code
# Security) licence. Shipping it as a default would hand every repository made from
# this template a check that either costs money or stays red for a reason no code
# change can fix.

# The one question the other dependency scanners do not ask: what did THIS pull
# request add. Trivy, `pnpm audit` and OSV all read the tree as it stands, so a
# vulnerability inherited from before is indistinguishable from one just introduced —
# and the inherited ones are exactly what a report-only gate has to tolerate. This
# reads the diff of the dependency graph instead, which makes failing on it fair:
# whoever adds a known-vulnerable package can take it back out.
#
# Runs on every PR without a `paths:` filter. A lockfile is not the only way the graph
# moves — an override, a workspace field, an action pin all do — and the action simply
# reports no change when the graph did not move.
#
# GITHUB'S DEPENDENCY GRAPH MUST BE ENABLED — a one-time repository setting listed in
# `docs/get-started/setup-repository.md` §3. Without it the action fails rather than standing
# down, which is deliberate: a gate that quietly skips when the thing it reads is switched off
# is indistinguishable from one that found nothing, and this is the only layer that sees what a
# pull request ADDED.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    # The action reads the comparison between a PR's base and head, which a manual run
    # has no way to supply.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            prod.app-api.stepsecurity.io:443
            mise-versions.jdx.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            api.deps.dev:443
            api.securityscorecards.dev:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `high` matches the dependency audit gate's threshold, so the two
      # do not disagree about the same package for different reasons.
      #
      # `comment-summary-in-pr` posts through the action rather than the shared upsert
      # action: the body is the action's own structured summary, not a check log.
      - name: Review the dependency diff
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
