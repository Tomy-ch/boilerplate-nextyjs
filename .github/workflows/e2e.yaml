name: E2E

# Drives the built application through its main journeys, and compares each screen
# against its baseline image.
#
# What this job covers beyond the story-level checks (vrt.yaml / a11y.yaml):
#
#   * Journeys       — navigation, filters and the auth pre-dispatch across screens.
#   * Browser errors — hydration mismatches, exceptions thrown while rendering, and
#                      failed requests. A hydration mismatch compiles, type-checks and
#                      only ever shows up in a real browser, so nothing else can see it.
#   * Responsive     — the three bands the styling system fixes, read from the design tokens.
#   * Cross browser  — Chromium, Firefox and WebKit. Those are the three rendering
#                      engines modern browsers reduce to (the support matrix defers the version
#                      floor to the repository created from this template), and they are
#                      ALL this job looks at: no browser brands, no versions. The versions
#                      are whatever the pinned Playwright image ships.
#
# The application runs on the runner and only the browsers run inside the digest-pinned
# Playwright container. `node_modules` is resolved for the OS and CPU that installed it,
# so starting the server inside the container would need a second, linux-specific tree.
# Pinning the browsers and fonts is what the image is for; pinning the application's
# runtime is not.
#
# Baselines are never written here. Producing them is a deliberate human act, the same
# as for the story-level images (vrt/README.md).
#
# No `paths:` filter, deliberately — README.md says why every workflow runs on every PR. The
# job always starts and reports its context; only the expensive steps stand down.
#
# ## Deferred, and what still runs anyway
#
# The expensive steps stand down on an ordinary pull request. The cadence, the diff shapes
# that run it without a label, and why the line is drawn there are in README.md
# § 先送りにする検査. What is specific to this job: it is the cheapest of the three, and
# deferring it is what lets a hydration mismatch — visible nowhere else — land on the merge
# rather than before it.

on:
  pull_request:
    # Spelled out because naming `types` replaces the default set rather than adding to it,
    # and `labeled` is what lets `run-e2e` start a run on a pull request already open.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - production
      - staging
      - develop
      - 'release/**'
  schedule:
    # 18:00 UTC daily (03:00 JST), alongside the other deferred checks.
    - cron: '0 18 * * *'
  workflow_dispatch:

# Select the CI environment file (env/.env.ci), which is the one that puts the API in
# mock mode. Without a mocked API the journeys would need a backend, and the failures
# would stop being about this repository.
env:
  APP_ENV: ci

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Only for the branch issue a failure off a pull request raises; the reporting of a
      # pull-request result stays in the `e2e-comment` job below.
      issues: write

    outputs:
      title: ${{ steps.e2e.outputs.title || steps.standdown.outputs.title }}
      # Standing down is a success for the comment: nothing is created on a quiet PR,
      # and an earlier FAIL comment is overwritten by the stand-down body instead of
      # being left beside a green check.
      status: ${{ steps.e2e.outputs.status || 'success' }}

    # A step's `if` cannot read `secrets`, only `env`. The app id is not a secret.
    env:
      BASELINE_APP_ID: ${{ secrets.BASELINE_APP_ID }}

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            prod.app-api.stepsecurity.io:443
            mise-versions.jdx.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            fonts.googleapis.com:443
            fonts.gstatic.com:443
            mcr.microsoft.com:443
            *.data.mcr.microsoft.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base ref has to be resolvable for the `force` diff below; a shallow checkout
          # leaves it a bad object and the decision would silently see no changes. **The
          # condition is inverted on purpose** — GitHub's pseudo-ternary falls through to the
          # `||` side whenever the value before it is falsy, and `0` is, so `0` goes after `||`.
          fetch-depth: ${{ github.event_name != 'pull_request' && 1 || 0 }}

      - name: Decide whether this event has to drive the journeys now
        id: trigger
        uses: ./.github/actions/check-trigger
        with:
          label: run-e2e
          labels: ${{ toJSON(github.event.pull_request.labels.*.name) }}

      # Asked before the toolchain, because it is the one answer that costs nothing and can
      # settle the question on its own. The list matches the story-level jobs': the journeys
      # walk the built application, so anything it is built from decides what they see. Why
      # each job keeps its own copy instead of a shared default is in README.md.
      - name: Decide whether the diff can reach a journey
        id: scope
        uses: ./.github/actions/diff-scope
        with:
          base-ref: ${{ github.base_ref }}
          ignore: |
            docs/*
            *.md
            .claude/*
            .agents/*
            .cursor/*
            .gemini/*

      # Installed before the `force` decision because that decision is TypeScript, and on a
      # run that goes ahead these are the same steps it would have paid for anyway. What is
      # new is the pull request that ends up standing down: it now pays for the toolchain to
      # be told so. That is the price of the question, and it is named in the header above.
      - name: Setup mise and the pinned tools
        if: steps.scope.outputs.relevant == 'true'
        uses: ./.github/actions/setup-mise
        with:
          tools: core:node aqua:pnpm/pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        if: steps.scope.outputs.relevant == 'true'
        uses: ./.github/actions/setup-deps

      # Only asked when the cadence did not already say yes, because its answer can only add
      # a reason to run, never remove one.
      #
      # `continue-on-error` because failing here must not take the verdict with it. Every step
      # below carries an implicit `success()`, so a failure would skip the stand-down note too
      # and leave the pull request a red check with no comment at all — the one thing the note
      # exists to prevent. `gate` reads the outcome instead and says what happened.
      - name: Decide whether the diff itself earns a run
        id: force
        continue-on-error: true
        if: >-
          github.event_name == 'pull_request' &&
          steps.trigger.outputs.run != 'true' &&
          steps.scope.outputs.relevant == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm exec tsx scripts/e2e trigger "origin/${BASE_REF}"

      # One answer for every step below, so that the reason for standing down stays readable:
      # a diff that cannot reach a journey is not the same as a diff that is waiting for the
      # merge, and the comment tells them apart by `scope` alone.
      - name: Note whether the journeys run
        id: gate
        env:
          CADENCE: ${{ steps.trigger.outputs.run }}
          FORCED: ${{ steps.force.outputs.kind }}
          ASKED: ${{ steps.force.outcome }}
          RELEVANT: ${{ steps.scope.outputs.relevant }}
          DETAIL: ${{ steps.force.outputs.detail }}
        shell: bash
        run: |
          set -euo pipefail

          # A decision that could not be taken is not evidence that the diff does not earn a
          # run, so it falls open — the same reading `diff-scope` applies to a diff it cannot
          # take. It warns rather than notices: standing down would be the cheaper mistake to
          # miss, and a silent fall-open reads afterwards like a diff that earned its run.
          forced="${FORCED}"
          if [ "${ASKED}" = 'failure' ]; then
            echo '::warning::Could not decide whether the diff earns a run; running anyway.'
            forced=force
          fi

          if [ "${RELEVANT}" = 'true' ] && { [ "${CADENCE}" = 'true' ] || [ "${forced}" = 'force' ]; }; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi

          if [ "${FORCED}" = 'force' ]; then
            echo "::notice::Running without a label: ${DETAIL}"
          fi

      - name: Fetch the baseline images
        if: steps.gate.outputs.run == 'true'
        uses: ./.github/actions/setup-baselines
        with:
          app-id: ${{ secrets.BASELINE_APP_ID }}
          private-key: ${{ secrets.BASELINE_APP_PRIVATE_KEY }}

      - name: Cache the Next.js build cache
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build the app, start it and drive it
        id: e2e
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set +e

          status=success
          : > /tmp/e2e-full.log
          : > /tmp/e2e-failed.log

          # Each stage keeps its own log and its own JSON report, and only the failing ones
          # are reported. The report is what the body reads: Playwright already separated the
          # specs that failed from the ones that passed, so nothing here has to re-derive that
          # from log text (`scripts/test-report`). The log tail is passed alongside
          # it and is used only where the report cannot decide — a stage that died before
          # writing one.
          stage() {
            local name="$1"
            local report="$2"
            shift 2

            # Streamed for the same reason as `vrt.yaml`: a cancelled or timed-out run must
            # still leave a log behind.
            "$@" 2>&1 | tee "/tmp/e2e-${name}.log"
            local code=${PIPESTATUS[0]}

            cat "/tmp/e2e-${name}.log" >> /tmp/e2e-full.log

            if [ "${code}" -ne 0 ]; then
              status=failure
              tail -n 200 "/tmp/e2e-${name}.log" > "/tmp/e2e-${name}.tail"
              printf '## %s\n\n' "${name}" >> /tmp/e2e-failed.log
              pnpm exec tsx scripts/test-report \
                "${report}" "/tmp/e2e-${name}.tail" "/tmp/e2e-${name}.md"
              cat "/tmp/e2e-${name}.md" >> /tmp/e2e-failed.log
            fi
          }

          # A port each: `make e2e` kills the `pnpm start` wrapper but the `next start` child
          # it spawned can outlive it and keep :3100 bound (issue #465). Sharing the port
          # makes the next stage fail before it drives anything.
          #
          # The report paths are the `json` reporter's `outputFile` in each stage's config.
          # They differ per stage on purpose: one shared path would leave the last stage's
          # report standing in for all three.
          stage journeys tmp/e2e/report.json make e2e
          stage maintenance tmp/e2e/maintenance-report.json make e2e-maintenance E2E_PORT=3101
          stage metadata tmp/e2e/metadata-report.json make e2e-metadata E2E_PORT=3103

          echo "status=${status}" >> "$GITHUB_OUTPUT"

          if [ "${status}" = 'success' ]; then
            echo "title=## ✅ E2E: PASS" >> "$GITHUB_OUTPUT"
          else
            echo "title=## ❌ E2E: FAIL" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      # The guidance is split by what actually failed. A retake fixes a changed pixel and
      # nothing else, so printing the retake note unconditionally tells the reader to
      # retake a journey failure or a missing screen declaration — neither of which a
      # retake can repair, and the second of which a retake would bake in as the truth.
      - name: Collect the comment body
        if: always() && steps.e2e.outputs.status != ''
        env:
          HEAD_REF: ${{ github.head_ref }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          # The comment is written to two files, and the split is what decides what renders.
          # `e2e.log` is folded inside a code block because a log line is whatever the tools
          # printed — source text a pull request controls, which must not become markup. The
          # notes are workflow-authored prose, and they render, because a copy-me command says
          # nothing when shown as literal characters.
          mkdir -p /tmp/e2e-comment

          if [ "${{ steps.e2e.outputs.status }}" = "success" ]; then
            echo '主要ジャーニーが 3 つの描画エンジンで通り、画面の見た目も基準画像と一致しました。停止中の扱いと公開面も成立しています。' > /tmp/e2e-comment/e2e.log
            : > /tmp/e2e-comment/e2e-notes.md
            exit 0
          fi

          cp /tmp/e2e-failed.log /tmp/e2e-comment/e2e.log

          # One run can fail in several kinds at once, and the kinds are what decide which next
          # step is the right one — so the classification is a decision with cases, and it lives
          # in `scripts/e2e/comment.ts` where those cases are pinned down.
          # Degrades rather than reddening the step. The comment is posted from an `always()`
          # step either way, so a failure here would otherwise leave the reader an empty notes
          # section with nothing saying why.
          pnpm exec tsx scripts/e2e comment /tmp/e2e-full.log tmp/e2e/report.json \
            > /tmp/e2e-comment/e2e-notes.md ||
            echo '（案内を組み立てられませんでした。上のログと artifact を見てください。）' \
              > /tmp/e2e-comment/e2e-notes.md

      # A job that stood down still owes the pull request a verdict. Without this, the ❌
      # comment an earlier push produced stays beside a green check once the journeys stop
      # running — README.md's "update the comment on success too" invariant, applied to
      # standing down. The two files are the ones the comment job reads, so the split
      # between them (log folded into a code block, notes rendered) has to hold here too.
      - name: Note that the journeys did not run
        id: standdown
        if: steps.gate.outputs.run != 'true'
        shell: bash
        env:
          # Compared in the shell rather than interpolated into it. Why the two stand-down
          # reasons stay distinguishable: README.md, "降りた理由は 2 つあり、書き分ける".
          #
          # `scope` alone, because standing down with a diff that CAN reach a journey means
          # nothing asked for it: neither the label nor the diff's own structure.
          DEFERRED: ${{ steps.scope.outputs.relevant == 'true' }}
        run: |
          mkdir -p /tmp/e2e-comment

          if [ "${DEFERRED}" = "true" ]; then
            echo 'title=## ⏭️ E2E: SKIP (deferred to the merge and the nightly pass)' >> "$GITHUB_OUTPUT"
            echo '主要ジャーニーの走行は、保護ブランチへの merge と日次で回ります。この PR では実行していません。' > /tmp/e2e-comment/e2e.log
            cat <<'NOTE' > /tmp/e2e-comment/e2e-notes.md

          この PR で回すなら `run-e2e` ラベルを付けてください。`develop` / `staging` / `production`
          を base とする PR では、ラベルの有無に関わらず必ず回ります。

          **器（layout と、それが組む shell の部品）・全画面が読む土台の CSS・画面の宣言を動かした差分は、ラベル無しでも回ります。**
          この PR はそのどれにも当たりませんでした。routing やジャーニーが辿るものを動かしたなら、
          待たずに回してください —— hydration の不一致はこのジョブでしか見えません。
          NOTE
          else
            echo 'title=## ⏭️ E2E: SKIP (diff cannot reach a journey)' >> "$GITHUB_OUTPUT"
            echo 'この PR の差分はジャーニーに届かないため、実行していません。' > /tmp/e2e-comment/e2e.log
            : > /tmp/e2e-comment/e2e-notes.md
          fi

      # The HTML report and the traces. Without them the only evidence of a failure is
      # the assertion text, which cannot be judged for a visual difference.
      - name: Upload the report and traces
        if: always() && steps.e2e.outputs.status == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diff
          path: tmp/e2e
          retention-days: 7
          if-no-files-found: warn

      # Read back by `baseline-retake.yaml` to bound what the label may retake. Kept
      # separate from the diff bundle so the retake path downloads only the report.
      #
      # `warn`, not `error`: a run that failed while building or booting never started
      # Playwright, and the retake path already reads a missing report as "nothing reported".
      - name: Upload the machine-readable report
        if: always() && steps.e2e.outputs.status == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          path: tmp/e2e/report.json
          retention-days: 7
          if-no-files-found: warn

      # Handed to the commenting job through an artifact rather than a job output,
      # because the body is a file whose size is not bounded by the output limit.
      - name: Hand the comment body to the commenting job
        if: always() && github.event_name == 'pull_request' && (steps.e2e.outputs.status != '' || steps.standdown.outcome == 'success')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-comment
          path: /tmp/e2e-comment/
          retention-days: 1
          if-no-files-found: error

      # One issue per branch, reopened rather than duplicated — README.md,
      # "PR の外で落ちたら、issue にする".
      #
      # This is what the deferred cadence costs, and for this job it is the cost that matters
      # most — a hydration mismatch is visible nowhere else, so if nobody opens the run, the
      # defect is simply not known.
      - name: Compose what the issue says
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.gate.outputs.run == 'true' && steps.e2e.outputs.status != 'success' }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # The evidence is Playwright's own output — assertion text this repository does not
          # author — so it is handed over as `tool-output` (how each kind is rendered is
          # `scripts/lib/issue-body.ts`).
          cat <<'NOTE' > /tmp/e2e-note.md
          `e2e-diff` artifact に HTML レポートと trace が入っています。

          手元で確かめるなら `make e2e`、CI が落とした画面だけなら `make e2e-review` です。停止中の
          扱いと公開面は別の起動で回るので、`make e2e-maintenance` / `make e2e-metadata` です。

          **見た目の差分だけなら基準画像の撮り直しで済みますが、ジャーニー・停止中の扱い・公開面の
          失敗と、画面の宣言漏れは撮り直しでは直りません。** 撮り直すと、後者は誤った状態が正として
          焼き付きます (`e2e/README.md`)。
          NOTE

          # Degrades to a fixed body rather than failing: the step that raises the issue does
          # not gate on this one, so a failure here would file an empty issue (README.md,
          # "PR の外で落ちたら、issue にする").
          pnpm exec tsx scripts/ci-report issue-body \
            --heading '落ちた内容:' \
            --kind tool-output \
            --evidence /tmp/e2e-failed.log \
            --run-url "${RUN_URL}" \
            --note /tmp/e2e-note.md > /tmp/e2e-guard.md ||
            printf '%s\n\n実行: %s\n' '❌ 本文を組み立てられませんでした。実行ログを読んでください。' "${RUN_URL}" > /tmp/e2e-guard.md

      # Minted rather than using `GITHUB_TOKEN` for its rate limit; falls back when the app
      # is absent (README § PR コメント).
      - name: Mint a token for the issue
        id: api-token
        if: env.BASELINE_APP_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BASELINE_APP_ID }}
          private-key: ${{ secrets.BASELINE_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-contents: read

      - name: Raise it where it has an owner
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.gate.outputs.run == 'true' && steps.e2e.outputs.status != 'success' }}
        uses: ./.github/actions/upsert-issue
        with:
          github-token: ${{ steps.api-token.outputs.token || secrets.GITHUB_TOKEN }}
          title: '[E2E] ${{ github.ref_name }} でジャーニーまたは画面が落ちている'
          body-file: /tmp/e2e-guard.md
          label: bug

      # `status` is empty when the run stood down, which is not a failure. The scope guard
      # has to be repeated here rather than left to `status`, because "no verdict" and "a bad
      # verdict" read the same to the expression below.
      - name: Fail if any of the three stages failed
        if: always() && steps.gate.outputs.run == 'true' && steps.e2e.outputs.status != 'success'
        run: exit 1

  # Holds no secret beyond `GITHUB_TOKEN`, so the body it publishes cannot carry one.
  e2e-comment:
    if: always() && github.event_name == 'pull_request'
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            prod.app-api.stepsecurity.io:443
            mise-versions.jdx.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            fonts.googleapis.com:443
            fonts.gstatic.com:443
            mcr.microsoft.com:443
            *.data.mcr.microsoft.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the comment body
        id: body
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-comment
          path: /tmp/e2e-comment

      - name: Comment the E2E result on PR
        if: steps.body.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- e2e-result -->'
          status: ${{ needs.e2e.outputs.status }}
          title: ${{ needs.e2e.outputs.title }}
          body-file: /tmp/e2e-comment/e2e.log
          # Every failing stage writes its half through `scripts/test-report`, which fences
          # each unaltered value to its own content — the second way the input's contract can
          # be met. The stand-down and success bodies are workflow-authored prose.
          body-sanitized: 'true'
          notes-file: /tmp/e2e-comment/e2e-notes.md
          details-summary: 'E2E の失敗（全件）'
