name: Images Pin

# Verifies every container image reference is pinned to the digest recorded in
# `docker/images-pin.toml`. A registry tag can be repointed at different content
# under the same name, so an unpinned or drifted reference fails the PR.
#
# The check never reaches the network: it compares the compose files, the
# Dockerfiles, and the `uses: docker://` steps in workflow / composite action
# definitions against the lockfile. Resolving tags to digests (the step that does
# call out) is a deliberate local action — `make images-pin-resolve` — and is not
# run in CI.
#
# A separate workflow from `actions-pin` on purpose: same discipline, different
# supply chain. The two scan some of the
# same files but never the same lines — a `docker://` step is a registry
# reference, which `actions-pin` cannot resolve through `git ls-remote`.
#
# Deliberately unfiltered by `paths`; the reason every CI Checks workflow runs on
# every PR is in README.md.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images-pin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            prod.app-api.stepsecurity.io:443
            mise-versions.jdx.dev:443
            nodejs.org:443
            registry.npmjs.org:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup mise and the pinned tools
        uses: ./.github/actions/setup-mise
        with:
          tools: core:node aqua:pnpm/pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        uses: ./.github/actions/setup-deps

      - name: Run images-pin check
        id: images-pin
        shell: bash
        run: |
          set +e

          make images-pin-check 2>&1 | tee /tmp/images-pin.log
          code=${PIPESTATUS[0]}

          if [ "${code}" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ Images pin: PASS (digest pinned)" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ❌ Images pin: FAIL (unpinned or drifted)" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      - name: Comment images pin result on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- images-pin-result -->'
          status: ${{ steps.images-pin.outputs.status }}
          title: ${{ steps.images-pin.outputs.title }}
          body-file: /tmp/images-pin.log
          details-summary: 'images-pin log'

      - name: Fail if the pin check failed
        if: always() && steps.images-pin.outputs.status != 'success'
        run: exit 1
