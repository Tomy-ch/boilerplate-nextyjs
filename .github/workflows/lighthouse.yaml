name: Lighthouse

# Measures the Core Web Vitals of every screen and holds them against
# `performance-budget.yaml`.
#
# The screens come from `e2e/lib/screens.ts` — the same declaration the E2E job walks. The
# list is deliberately not restated here: a second list would let a screen be added to one
# and not the other, and the half that never learned about it would stay green.
#
# Only three metrics are judged, not the performance score. The score is a weighted mean of
# five metrics, so a drop in it cannot say WHICH metric dropped. INP needs a real user
# interaction and cannot be measured in a lab, so TBT stands in for it (RUM owns the
# field side).
#
# The browsers here are NOT the digest-pinned Playwright container the VRT and E2E jobs use.
# That image exists to fix fonts and rasterization, which a pixel comparison depends on and
# a number does not; what has to be fixed for a number is the browser version, and the
# `@playwright/test` entry in `pnpm-lock.yaml` fixes that on every machine.
#
# ## Deferred, and what still runs anyway
#
# The measurement does not run on an ordinary pull request. The cost that forces that, the
# cadence that replaces it, and the two diff shapes that measure without a label are in
# README.md § 先送りにする検査 and the Lighthouse row of the workflow table. What is specific
# here: a screen added on this branch has no earlier number for the release run to compare
# against, so deferring it defers the comparison and not only the detection.
#
# The job reports a context on every pull request either way, which is what would let it
# become a required check later; it is deliberately not one today, because the budget is not
# yet reachable on this sample.

on:
  pull_request:
    # Spelled out because naming `types` replaces the default set rather than adding to it,
    # and `labeled` is what lets `run-lighthouse` start a run on a pull request already open.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - production
      - staging
      - develop
      - 'release/**'
  schedule:
    # 18:00 UTC daily (03:00 JST).
    - cron: '0 18 * * *'
  workflow_dispatch:

# ## How the measurement is split across machines
#
# `lighthouse-shard` is the fan-out and `lighthouse` collects what came back (README.md,
# 「並列度に台数を書かない」, owns when a matrix may divide work at all). Four properties are
# this job's own:
#
# **Never inside one machine.** What is measured is CPU-bound (TBT, LCP), so two measurements
# on one runner take each other's CPU and the numbers stop meaning anything against the budget.
#
# **Only a pull request is split.** Nobody is waiting on the protected-branch and daily runs,
# and every extra machine repeats the fixed cost.
#
# **The decision to measure is asked once, in `plan`.** Asking it per shard would be four
# answers to one question, and standing down is the common case.
#
# **The budget is judged by the collecting job.** A shard measures only the screens it was
# given, so "the budget declares a screen that no longer exists" can only be answered by
# something that saw all of them.

# Select the CI environment file (env/.env.ci), which is the one that puts the API in mock
# mode. Without a mocked API the screens would need a backend, and a slow response over
# there would read as a regression in here.
env:
  APP_ENV: ci

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Asked once, for every job below (header: "The decision to measure is asked once"); the
  # answer decides whether any machine starts at all.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    outputs:
      # The gate can only REMOVE a reason to measure, never add one: an input state that
      # already met the budget cannot start meeting it differently, so measuring it again
      # only re-samples the runner. Every other reason still has to say yes first.
      run: >-
        ${{ steps.gate.outputs.decision != 'skip'
        && (steps.cadence.outputs.run == 'true' || steps.trigger.outputs.kind == 'force') }}
      # The width, as data rather than as a condition on a job. A pull request is the only
      # event where a person is waiting, so it is the only one that pays for extra machines.
      shards: ${{ github.event_name == 'pull_request' && '[1, 2, 3, 4]' || '[1]' }}

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            prod.app-api.stepsecurity.io:443
            mise-versions.jdx.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            cdn.playwright.dev:443
            playwright.download.prss.microsoft.com:443
            storage.googleapis.com:443
            fonts.googleapis.com:443
            fonts.gstatic.com:443
            accounts.google.com:443
            android.clients.google.com:443
            clients2.google.com:443
            mtalk.google.com:443
            update.googleapis.com:443
            www.google.com:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # The base ref has to be resolvable for the `trigger` diff; a shallow checkout
          # leaves it a bad object and the decision would silently see no changes. **The
          # condition is inverted on purpose** — GitHub's pseudo-ternary falls through to the
          # `||` side whenever the value before it is falsy, and `0` is, so `0` goes after `||`.
          fetch-depth: ${{ github.event_name != 'pull_request' && 1 || 0 }}

      - name: Setup mise and the pinned tools
        uses: ./.github/actions/setup-mise
        with:
          tools: core:node aqua:pnpm/pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        uses: ./.github/actions/setup-deps
      - name: Decide whether this event has to be measured now
        id: cadence
        uses: ./.github/actions/check-trigger
        with:
          label: run-lighthouse
          labels: ${{ toJSON(github.event.pull_request.labels.*.name) }}

      # Only asked when the shared four did not already say yes, because its answer can only
      # add reasons to measure, never remove one.
      # The record of which input state already met the budget. `make lighthouse-gate` hashes
      # the inputs itself and answers `skip` when they match, so the cache only has to carry
      # the previous answer forward — a miss reads as "never measured" and measures.
      - name: Restore the last measured input state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/lighthouse/verified-inputs.sha256
          key: lighthouse-verified-${{ github.run_id }}
          restore-keys: lighthouse-verified-

      # Asked before the diff, because its answer costs nothing and can settle the question on
      # its own — a label applied to an open pull request re-triggers this workflow with a tree
      # that is byte-for-byte what the previous run already measured.
      - name: Decide whether the inputs already met the budget
        id: gate
        run: |
          echo "decision=$(make --no-print-directory lighthouse-gate)" >> "$GITHUB_OUTPUT"

      - name: Decide whether the diff itself earns a measurement
        id: trigger
        if: github.event_name == 'pull_request' && steps.cadence.outputs.run != 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm exec tsx scripts/lighthouse trigger "origin/${BASE_REF}"

      # The Next.js build cache is deliberately NOT restored here. A restored cache changes
      # how much work the first render does, and the numbers this job produces would then
      # depend on which branch last populated it rather than on this branch's code.

  lighthouse-shard:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    strategy:
      # One machine failing says nothing about the others, and the table has to list every
      # screen that was measured. Cancelling the rest would report a subset as the whole.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            prod.app-api.stepsecurity.io:443
            mise-versions.jdx.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            cdn.playwright.dev:443
            playwright.download.prss.microsoft.com:443
            storage.googleapis.com:443
            fonts.googleapis.com:443
            fonts.gstatic.com:443
            accounts.google.com:443
            android.clients.google.com:443
            clients2.google.com:443
            mtalk.google.com:443
            update.googleapis.com:443
            www.google.com:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # Same depth and same inverted condition as the `plan` job's checkout, for the reason
          # given there.
          fetch-depth: ${{ github.event_name != 'pull_request' && 1 || 0 }}

      - name: Setup mise and the pinned tools
        uses: ./.github/actions/setup-mise
        with:
          tools: core:node aqua:pnpm/pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache the Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        uses: ./.github/actions/setup-deps
      - name: Build the app, start it and measure this machine's share
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ strategy.job-total }}
        run: |
          set -euo pipefail

          # Streamed for the same reason as `vrt.yaml`: a cancelled or timed-out run must
          # still leave a log behind.
          #
          # This machine does not judge. It measured a subset, so it cannot answer whether
          # the budget names a screen that no longer exists; the collecting job does that
          # once, over everything that came back.
          make lighthouse LIGHTHOUSE_SHARD="${SHARD_INDEX}/${SHARD_TOTAL}" 2>&1 \
            | tee /tmp/lighthouse-full.log

      # `if: always()` so a machine that failed still hands over what it recorded. The
      # collecting job counts what arrived: a hole surfaces as a missing machine rather than
      # as a screen that looks unmeasured.
      - name: Hand the measurements to the collecting job
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-lhr-${{ matrix.shard }}
          path: tmp/lighthouse
          retention-days: 30
          if-no-files-found: error

  lighthouse:
    needs: [plan, lighthouse-shard]
    # Runs whatever the machines did. A shard that FAILED still has to produce a red
    # `lighthouse` and say which screen moved; a job that never starts reports nothing.
    #
    # A CANCELLED shard is excluded: no result reaches here, which is indistinguishable from
    # a measurement that produced nothing. The run that superseded this one is measuring
    # already. `test.yaml` keeps a bare `always()` because its context is required and an
    # absent report blocks the merge forever; this one is not required.
    if: ${{ !cancelled() && needs.lighthouse-shard.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            prod.app-api.stepsecurity.io:443
            mise-versions.jdx.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            cdn.playwright.dev:443
            playwright.download.prss.microsoft.com:443
            storage.googleapis.com:443
            fonts.googleapis.com:443
            fonts.gstatic.com:443
            accounts.google.com:443
            android.clients.google.com:443
            clients2.google.com:443
            mtalk.google.com:443
            update.googleapis.com:443
            www.google.com:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # Same depth and same inverted condition as the `plan` job's checkout, for the reason
          # given there.
          fetch-depth: ${{ github.event_name != 'pull_request' && 1 || 0 }}

      - name: Setup mise and the pinned tools
        uses: ./.github/actions/setup-mise
        with:
          tools: core:node aqua:pnpm/pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        uses: ./.github/actions/setup-deps
      - name: Collect what every machine measured
        if: needs.plan.outputs.run == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: tmp/lighthouse/
          pattern: lighthouse-lhr-*
          merge-multiple: true

      # The step id stays `lighthouse` because everything downstream reads it. What changed
      # is what it runs: the judging half, over every machine's measurements at once. A
      # machine that never reported is named as such here — the merge refuses to judge a
      # partial set, because the screens it never saw would read as screens the budget
      # declares and the tree no longer has.
      - name: Merge the measurements and judge them against the budget
        id: lighthouse
        if: needs.plan.outputs.run == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set +e

          make lighthouse-merge 2>&1 | tee /tmp/lighthouse-full.log
          code=${PIPESTATUS[0]}

          if [ "${code}" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      # Written only after the budget was met, and only from the collecting job — a shard
      # knows its own screens met theirs, not that every screen did.
      - name: Hash the measured inputs
        if: steps.lighthouse.outputs.status == 'success'
        run: make lighthouse-record-verified

      - name: Record the measured input state
        if: steps.lighthouse.outputs.status == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/lighthouse/verified-inputs.sha256
          key: lighthouse-verified-${{ github.run_id }}

      - name: Collect the table for the pull request
        id: table
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.lighthouse.outputs.status != '' }}
        run: |
          if sed -n '/^| 画面 |/,$p' /tmp/lighthouse-full.log > /tmp/lighthouse-table.md &&
             [ -s /tmp/lighthouse-table.md ]; then
            echo 'has-table=true' >> "$GITHUB_OUTPUT"
          else
            echo '計測が表を出す前に落ちました。ジョブのログを見てください。' > /tmp/lighthouse-table.md
            echo 'has-table=false' >> "$GITHUB_OUTPUT"
          fi

      # `body-sanitized` follows the table's presence. The cells are screen names —
      # `resolveScreens` constrains them to a set that cannot make markup — and numbers this
      # job computed, so a table renders. When the measurement died before printing one there
      # is nothing sanitized to show, and the fallback sentence goes in a code block instead.
      - name: Comment the measurement on PR
        if: ${{ !cancelled() && steps.table.outcome == 'success' }}
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- lighthouse-result -->'
          status: ${{ steps.lighthouse.outputs.status }}
          title: >-
            ${{ steps.lighthouse.outputs.status == 'success' && '## ✅ Lighthouse — PASS (Core Web Vitals)'
            || '## ❌ Lighthouse — FAIL (Core Web Vitals)' }}
          body-file: /tmp/lighthouse-table.md
          details-summary: '画面ごとの Core Web Vitals'
          body-sanitized: ${{ steps.table.outputs.has-table }}

      # The per-run results, so whoever picks up the issue can open the screen that moved
      # instead of re-measuring to find out which one it was.
      - name: Compose what the issue says
        id: guard
        # The same predicate the failing step below uses. An EMPTY status is not a failing
        # one — the input gate can decide the measurement is not owed, and nothing was measured.
        if: >-
          ${{ !cancelled() && github.event_name != 'pull_request' &&
          ((steps.lighthouse.outputs.status != '' && steps.lighthouse.outputs.status != 'success')
          || (needs.plan.outputs.run == 'true' && needs.lighthouse-shard.result != 'success')) }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # The table is what says which screen moved, and it is left to render as markdown:
          # its cells are screen names the declaration fixes and numbers this job computed.
          # The measurement may never have produced a table at all — the browser can fail to
          # install — so every fallback ends in something printable.
          # `|| true` is what makes the fallbacks below reachable: under `-e`, a `sed` against
          # a log that was never written takes the step with it.
          #
          # **Which fallback fired also decides how the evidence may be rendered.** The table
          # and this workflow's own sentence are ours; the log tail is whatever the tools
          # printed and must not become markup.
          kind=authored
          body="$(sed -n '/^| 画面 |/,$p' /tmp/lighthouse-full.log 2>/dev/null || true)"

          # Its presence is also the only evidence that screens were measured at all, so it
          # decides the title. Calling an install failure "over budget" names a cause nobody
          # established, and the title is what a reader sees first.
          if [ -n "${body}" ]; then
            echo "subject=Core Web Vitals が予算を超えている" >> "$GITHUB_OUTPUT"
          else
            echo "subject=計測が実行できていない" >> "$GITHUB_OUTPUT"
            kind=tool-output
            body="$(tail -n 60 /tmp/lighthouse-full.log 2>/dev/null || true)"
          fi

          if [ -z "${body}" ]; then
            kind=authored
            body='(計測そのものが実行できませんでした。実行ログを確認してください。)'
          fi

          cat <<'NOTE' > /tmp/lighthouse-note.md
          `lighthouse-lhr` artifact に、画面ごと・試行ごとの結果 (LHR) が入っています。
          <https://googlechrome.github.io/lighthouse/viewer/> へ落とすと読めます。

          手元で測り直すなら `make lighthouse` です。

          **ぶれを理由に閾値を緩めないでください。** 緩めるのは、その画面が重いことを設計として
          引き受けたときだけで、そのときは `performance-budget.yaml` の `lighthouse.screens` へ
          根拠付きで宣言します (ADR 0101)。
          NOTE

          printf '%s\n' "${body}" > /tmp/lighthouse-evidence.md

          # Degrades to a fixed body rather than failing: the step that raises the issue does
          # not gate on this one, so a failure here would file an empty issue (README.md,
          # "PR の外で落ちたら、issue にする").
          pnpm exec tsx scripts/ci-report issue-body \
            --kind "${kind}" \
            --evidence /tmp/lighthouse-evidence.md \
            --run-url "${RUN_URL}" \
            --note /tmp/lighthouse-note.md > /tmp/lighthouse-guard.md ||
            printf '%s\n\n実行: %s\n' '❌ 本文を組み立てられませんでした。実行ログを読んでください。' "${RUN_URL}" > /tmp/lighthouse-guard.md

      - name: Raise it where it has an owner
        # Same predicate as the step that composes the body — see the note there.
        if: >-
          ${{ !cancelled() && github.event_name != 'pull_request' &&
          ((steps.lighthouse.outputs.status != '' && steps.lighthouse.outputs.status != 'success')
          || (needs.plan.outputs.run == 'true' && needs.lighthouse-shard.result != 'success')) }}
        uses: ./.github/actions/upsert-issue
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          title: '[Lighthouse] ${{ github.ref_name }} で ${{ steps.guard.outputs.subject }}'
          body-file: /tmp/lighthouse-guard.md
          label: chore

      - name: Fail if a screen is over its budget
        if: ${{ !cancelled() && ((steps.lighthouse.outputs.status != '' && steps.lighthouse.outputs.status != 'success') || (needs.plan.outputs.run == 'true' && needs.lighthouse-shard.result != 'success')) }}
        run: exit 1
