name: Lint

# biome (full profile), the ESLint layer-boundary check, and the architecture
# declaration cross-check — the same command the pre-commit hook runs
# (hooks mirror CI). The hook is the fast first stop; this job is the authority.
#
# No `paths:` filter, deliberately — README.md says why every workflow runs on every PR.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            prod.app-api.stepsecurity.io:443
            mise-versions.jdx.dev:443
            nodejs.org:443
            registry.npmjs.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise and the pinned tools
        uses: ./.github/actions/setup-mise
        with:
          tools: core:node aqua:pnpm/pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        uses: ./.github/actions/setup-deps
      - name: Run lint
        id: lint
        shell: bash
        run: |
          set +e

          pnpm lint:ci 2>&1 | tee /tmp/lint.log
          code=${PIPESTATUS[0]}

          if [ "${code}" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ Lint: PASS" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ❌ Lint: FAIL" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      - name: Comment lint result on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- lint-result -->'
          status: ${{ steps.lint.outputs.status }}
          title: ${{ steps.lint.outputs.title }}
          body-file: /tmp/lint.log
          details-summary: 'lint log'

      # An empty status means the capture step never ran (an earlier step failed),
      # which is also a failure — the comparison is against 'success', not 'failure'.
      - name: Fail if lint failed
        if: always() && steps.lint.outputs.status != 'success'
        run: exit 1
