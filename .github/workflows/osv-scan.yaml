name: OSV Scan

# The dependency graph read against the OSV database. Trivy and `pnpm audit` already
# read the same graph, and the three disagree — different aggregation units, different
# databases. ADR 0110 §3 settles that: the UNION is the truth, so a third reader is
# not redundancy to be removed but a blind spot being closed.
#
# Two jobs, the same split the Trivy pair has (ADR 0110 §3.1):
#
#   osv-scan  reports, never fails
#   osv-gate  fails on a finding, only for a PR aimed at a protected branch
#
# Suppressions live in `osv-scanner.toml` with a reason and a removal condition, and
# the tool prints each one it applied — a filtered finding stays visible in the log.
#
# Deliberately unfiltered by `paths`; the reason every workflow runs on every PR is
# in README.md.

on:
  pull_request:
  schedule:
    - cron: '45 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  osv-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    outputs:
      status: ${{ steps.osv.outputs.status }}
      detail: ${{ steps.detail.outputs.markdown }}

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            prod.app-api.stepsecurity.io:443
            mise-versions.jdx.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            api.osv.dev:443
            tuf-repo-cdn.sigstore.dev:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # A dependency scanner reads the lockfile; no source change can alter what it finds.
      # This is the one place an allow-list is admissible (see the note in the action), and it
      # is admissible only because the weekly schedule above still scans the whole tree — a
      # mistake in this list defers a scan by at most a week rather than removing it.
      - name: Decide whether the diff can reach the dependency graph
        id: scope
        uses: ./.github/actions/diff-scope
        with:
          base-ref: ${{ github.base_ref }}
          only: |
            pnpm-lock.yaml
            package.json
            docs-viewer/package.json
            pnpm-workspace.yaml
            .trivyignore.yaml
            osv-scanner.toml
            .makefiles/security/trivy.mk
            .makefiles/security/osv.mk
            .makefiles/security/audit.mk
            scripts/audit-gate/*
            .github/workflows/dependency-scan.yaml
            .github/workflows/osv-scan.yaml
            .github/actions/diff-scope/*

      - name: Setup mise and the pinned tools
        if: steps.scope.outputs.relevant == 'true'
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:google/osv-scanner
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Three outcomes, not two. `OSV_DETECT_EXIT=1` stops the make target swallowing the
      # scanner's exit code, and osv-scanner answers exactly 1 for "found something" —
      # anything else non-zero is the tool itself failing. Findings still do not fail this
      # job; the separation exists so the comment below is only created when there is
      # something in it, and so the scheduled run can push a detection to a human.
      - name: Run the OSV scan
        id: osv
        if: steps.scope.outputs.relevant == 'true'
        shell: bash
        env:
          OSV_DETECT_EXIT: '1'
        run: |
          set +e

          make osv-scan 2>&1 | tee /tmp/osv.log
          code=${PIPESTATUS[0]}

          if [ "${code}" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## 📋 OSV scan: report" >> "$GITHUB_OUTPUT"
          elif [ "${code}" -eq 1 ]; then
            echo "status=findings" >> "$GITHUB_OUTPUT"
            echo "title=## ⚠️ OSV scan: 脆弱性を検出" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ⚠️ OSV scan: the scan itself failed" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      # Identifiers only. The detection notification has to name what was found, and the
      # action carries advisory ids out of the log rather than the log itself.
      - name: Build the detection detail
        id: detail
        if: steps.osv.outputs.status == 'findings'
        uses: ./.github/actions/notify-detail
        with:
          log-file: /tmp/osv.log

      # A job that stood down still owes the pull request a verdict; see dependency-scan.yaml.
      - name: Note that the diff cannot reach the dependency graph
        id: standdown
        if: steps.scope.outputs.relevant != 'true'
        shell: bash
        run: |
          echo 'title=## ⏭️ OSV scan: SKIP (依存グラフに届かない差分)' >> "$GITHUB_OUTPUT"
          echo 'この PR の差分は lockfile に届かないため、走査していません。木そのものは週次で走査します。' > /tmp/osv.log

      - name: Comment OSV result on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- osv-scan-result -->'
          status: ${{ steps.osv.outputs.status || 'success' }}
          title: ${{ steps.osv.outputs.title || steps.standdown.outputs.title }}
          body-file: /tmp/osv.log
          details-summary: 'osv-scanner log'

      # Findings do not fail this job; the scanner failing to run does. An empty status
      # is the capture step never having run, which belongs on the failing side.
      - name: Fail if the scan could not run
        if: always() && steps.scope.outputs.relevant == 'true' && steps.osv.outputs.status != 'success' && steps.osv.outputs.status != 'findings'
        run: exit 1

  osv-gate:
    # Expressed as a job condition rather than a `branches:` filter, so the context is
    # still reported on every PR (ADR 0153 §5).
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON('["production", "staging", "develop"]'), github.base_ref) || startsWith(github.base_ref, 'release/') || startsWith(github.base_ref, 'hotfix/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            prod.app-api.stepsecurity.io:443
            mise-versions.jdx.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            api.osv.dev:443
            tuf-repo-cdn.sigstore.dev:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup mise and the pinned tools
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:google/osv-scanner
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the OSV release gate
        id: osv
        shell: bash
        run: |
          set +e

          make osv-scan-release 2>&1 | tee /tmp/osv-release.log
          code=${PIPESTATUS[0]}

          if [ "${code}" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ OSV release gate: PASS" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## 🚨 OSV release gate: FAIL" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      - name: Comment OSV release result on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- osv-gate-result -->'
          status: ${{ steps.osv.outputs.status }}
          title: ${{ steps.osv.outputs.title }}
          body-file: /tmp/osv-release.log
          details-summary: 'osv-scanner log (release)'

      - name: Fail if a vulnerability was found
        if: always() && steps.osv.outputs.status != 'success'
        run: exit 1

  # Report-only by design, so a finding leaves the job green and the failure notification
  # below can never fire for one. Why only the weekly run notifies is in README.md § 通知.
  notify-detection:
    needs: osv-scan
    if: ${{ github.event_name == 'schedule' && needs.osv-scan.outputs.status == 'findings' }}
    uses: ./.github/workflows/notify.yaml
    with:
      detected: OSV scan found known vulnerabilities
      details: ${{ needs.osv-scan.outputs.detail }}
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

  # See README.md § 通知 (why only scheduled runs notify, and why cancelled counts).
  notify-failure:
    needs: [osv-scan, osv-gate]
    if: >-
      ${{ always() && github.event_name == 'schedule'
      && (contains(fromJSON('["failure", "cancelled"]'), needs.osv-scan.result)
      || contains(fromJSON('["failure", "cancelled"]'), needs.osv-gate.result)) }}
    uses: ./.github/workflows/notify.yaml
    with:
      failed-job: osv-scan / osv-gate
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
