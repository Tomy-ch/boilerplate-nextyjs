name: SAST

# Opengrep over this repository's own source. The dependency scanners ask "is a
# library we pull in known-vulnerable"; this asks "does the code we wrote contain a
# vulnerable pattern" (ADR 0110 §3).
#
# GitHub's own analysis cannot leave GitHub and is licensed for a private repository,
# so a repository created from this template cannot count on it. This one is a pinned
# binary in mise.toml and runs anywhere, which is why the portable layer is the one that
# ships.
#
# Opengrep rather than Semgrep itself: the rule syntax is the same and `// nosemgrep:`
# suppressions still apply, but the fork is OSS, so the boilerplate does not hand a
# licence decision to whoever creates a repository from it.
#
# The scan holds a ZERO-FINDING BASELINE, which is the point — a new finding is signal
# rather than something to scroll past. Accepted exceptions are pinned in the source
# with `// nosemgrep: <rule-id>` beside the reason, so the judgement stays at the code.
#
# What is scanned, with which rules, and what is excluded all live in
# `.makefiles/security/opengrep.mk`. The gate and the SARIF upload read the same
# variables there, because a gate and an alert list describing different scans is
# worse than either one alone.
#
# THE RULES DO NOT COME FROM THE REGISTRY. They are pinned to a commit of
# `opengrep/opengrep-rules` and fetched by `scripts/opengrep-rules`, which verifies a digest
# over the extracted rules. The licence reason and the extraction constraints are owned by
# `README.md` § "SAST のルールをレジストリから引かない".
#
# Deliberately unfiltered by `paths`; the reason every workflow runs on every PR is
# in README.md.

on:
  pull_request:
  schedule:
    # New rules can turn existing code into a finding, so a scheduled run earns its
    # place even when nothing changed.
    - cron: '30 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            prod.app-api.stepsecurity.io:443
            mise-versions.jdx.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            semgrep.dev:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # What cannot change this scan's answer. The list is the deny side on purpose: anything
      # not named here still runs, so a missing entry costs one needless run while a wrong
      # entry would leave a scanner reporting on nothing (see the note in the action).
      # `public/**` is assets; opengrep's target list in opengrep.mk never opens them.
      - name: Decide whether the diff can reach this scan
        id: scope
        uses: ./.github/actions/diff-scope
        with:
          base-ref: ${{ github.base_ref }}
          ignore: |
            docs/*
            *.md
            .claude/*
            .agents/*
            .cursor/*
            .gemini/*
            public/*

      # node and pnpm join opengrep here because the rule set is fetched by
      # `scripts/opengrep-rules` rather than downloaded from the registry by the scanner.
      - name: Setup mise and the pinned tools
        if: steps.scope.outputs.relevant == 'true'
        uses: ./.github/actions/setup-mise
        with:
          tools: core:node aqua:pnpm/pnpm aqua:opengrep/opengrep
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        if: steps.scope.outputs.relevant == 'true'
        uses: ./.github/actions/setup-deps

      - name: Run the SAST gate
        id: sast
        if: steps.scope.outputs.relevant == 'true'
        shell: bash
        run: |
          set +e

          make sast 2>&1 | tee /tmp/sast.log
          code=${PIPESTATUS[0]}

          if [ "${code}" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ SAST: PASS (opengrep)" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ❌ SAST: FAIL (opengrep)" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      # A second pass for code scanning. It reads the same variables as the gate, so
      # the two cannot describe different scans.
      #
      # `continue-on-error` here, unlike in `bearer.yaml`, because this job's output is
      # the GATE — the verdict is already decided and reported by the step above. Code
      # scanning is where the detail goes, not where the answer lives, so losing it
      # costs navigability rather than the check itself.
      - name: Write the SARIF
        if: always() && steps.scope.outputs.relevant == 'true' && steps.sast.outputs.status != ''
        continue-on-error: true
        env:
          SAST_SARIF_FILE: opengrep.sarif
        run: make sast-sarif

      - name: Upload the SARIF to code scanning
        if: always() && steps.scope.outputs.relevant == 'true' && hashFiles('opengrep.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: opengrep.sarif
          category: opengrep

      # A job that stood down still owes the pull request a verdict: without a body here the
      # ❌ comment an earlier push produced would stay beside a green check once the diff
      # stops reaching the scanned source.
      - name: Note that the diff cannot reach the scan
        id: standdown
        if: steps.scope.outputs.relevant != 'true'
        shell: bash
        run: |
          echo 'title=## ⏭️ SAST: SKIP (走査対象に届かない差分)' >> "$GITHUB_OUTPUT"
          echo 'この PR の差分は opengrep の走査対象に届かないため、走査していません。木そのものは週次で走査します。' > /tmp/sast.log

      - name: Comment SAST result on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- sast-result -->'
          status: ${{ steps.sast.outputs.status || 'success' }}
          title: ${{ steps.sast.outputs.title || steps.standdown.outputs.title }}
          body-file: /tmp/sast.log
          details-summary: 'opengrep log'

      - name: Fail if a finding was reported
        if: always() && steps.scope.outputs.relevant == 'true' && steps.sast.outputs.status != 'success'
        run: exit 1

  # See README.md § 通知 (why only scheduled runs notify, and why cancelled counts).
  notify-failure:
    needs: sast
    if: ${{ always() && github.event_name == 'schedule' && contains(fromJSON('["failure", "cancelled"]'), needs.sast.result) }}
    uses: ./.github/workflows/notify.yaml
    with:
      failed-job: sast
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
