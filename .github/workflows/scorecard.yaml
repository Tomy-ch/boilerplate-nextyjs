name: OpenSSF Scorecard

# Measures this repository's own supply-chain posture — branch protection, pinned
# dependencies, token permissions, the presence of a security policy — rather than
# the code or the dependencies. For a boilerplate the posture IS the product: a repository
# created from this template receives these settings as files plus a setup step
# (`make setup-repository`), not as repository settings — creating from a template copies
# the tree, never the branch protection or the token permissions.
#
# The default branch is not a fixed name here: it moves with each release
# (`release/vX.Y.Z`), so the push trigger matches the namespace and the job narrows to
# whichever branch is currently the default one.
#
# Not a required check and no PR trigger. The score is a property of the repository,
# not of a change, and the analysis needs the default branch to read.

on:
  push:
    branches:
      - 'release/*'
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      id-token: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            prod.app-api.stepsecurity.io:443
            mise-versions.jdx.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            api.deps.dev:443
            api.osv.dev:443
            oss-fuzz-build-logs.storage.googleapis.com:443
            www.bestpractices.dev:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # `publish_results: false` — publishing sends the score to the OpenSSF public
      # dataset. That is a decision about this repository's name, not a technical one,
      # so it is left to whoever runs the generated repository.
      #
      # No `repo_token`, so `Branch-Protection` / `Fuzzing` / `CII-Best-Practices` stay
      # capped. All three are held there on purpose — BACKLOG W39 / W40 / W41.
      - name: Run the analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false

      # Not `continue-on-error`, for the reason `bearer.yaml` states: code scanning is
      # this job's entire output, so an upload that does not land leaves it reporting
      # green with nothing behind it.
      - name: Require the SARIF to exist
        run: test -s scorecard.sarif

      - name: Upload the SARIF to code scanning
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: scorecard.sarif
          category: scorecard

  # See README.md § 通知 (why only scheduled runs notify, and why cancelled counts).
  notify-failure:
    needs: scorecard
    if: ${{ always() && github.event_name == 'schedule' && contains(fromJSON('["failure", "cancelled"]'), needs.scorecard.result) }}
    uses: ./.github/workflows/notify.yaml
    with:
      failed-job: scorecard
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
