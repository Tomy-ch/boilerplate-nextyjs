name: Scripts Check

# Unit tests and the repository-wide 1:1 test-correspondence gate for the helper scripts
# under `scripts/**`.
#
# These are kept out of the Test workflow on purpose. What lives under `scripts/` is the
# checking machinery itself — the workflow linters, the pin checker, and the 1:1 gate — and
# all of it fails in the same direction when broken: it stops finding things and reports a
# clean run. Nothing downstream notices, because a gate that inspects nothing looks exactly
# like a repository with no violations. Splitting the job means a red mark here reads as
# "the machinery broke", never as "the app regressed".
#
# No `paths:` filter, deliberately — README.md says why every workflow runs on every PR. The
# 1:1 gate walks `src/`, `docs-viewer/`, `tokens/` and `mocks/` as well, so a change anywhere
# can produce a violation here.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            prod.app-api.stepsecurity.io:443
            mise-versions.jdx.dev:443
            nodejs.org:443
            registry.npmjs.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise and the pinned tools
        uses: ./.github/actions/setup-mise
        with:
          tools: core:node aqua:pnpm/pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        uses: ./.github/actions/setup-deps
      - name: Run the scripts suite with coverage
        run: make scripts-test

      # The unit tests pin the mechanism against fixtures; nothing else reads the markers
      # that live in the sources. Without this step an unbalanced `portal:replace-*` pair
      # would only throw for whoever creates a repository from the template.
      - name: Preview the repository-reference replacement
        run: >
          pnpm exec tsx scripts/setup/replace-repository-reference
          --repository example-org/example-app --dry-run
