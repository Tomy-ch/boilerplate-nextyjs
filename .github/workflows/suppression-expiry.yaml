name: Suppression Expiry

# Weekly re-read of the suppressions this repository declares.
#
# Why the rule needs a job that looks is in the README; this file is that job.
#
# Two limits are deliberate, and the report states both rather than reading as complete.
# Only dates are decided: "once upstream requires N or later" and "after the sample purge
# runs" cannot be evaluated, so every declaration is listed, not only the judged ones.
# And the surfaces that keep their reason in a comment (gitleaks, zizmor, the pnpm
# overrides, sonar) cannot be read per declaration at all — a parser drops comments —
# so only their date-bearing lines appear.
#
# Cooldown exemptions (`minimumReleaseAgeExclude` in pnpm-workspace.yaml, the
# `tools-cooldown-ignore:` comment above a mise.toml pin) are read per declaration, with the
# comment beside them as the reason, and fail when the reason, the version, or the date the
# window clears is missing — an exemption without a date has no withdrawal condition.
#
# Not attached to pull requests. Nothing a pull request changes can make a date arrive,
# and running it there would spend a job on every change to say the same thing.

on:
  schedule:
    # Weekly, offset from the other Monday jobs so the runner queue is not asked for
    # several at the same minute.
    - cron: '15 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  suppression-expiry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    # A step's `if` cannot read `secrets`, only `env`. The app id is not a secret.
    env:
      BASELINE_APP_ID: ${{ secrets.BASELINE_APP_ID }}

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            prod.app-api.stepsecurity.io:443
            mise-versions.jdx.dev:443
            nodejs.org:443
            registry.npmjs.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise and the pinned tools
        uses: ./.github/actions/setup-mise
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        uses: ./.github/actions/setup-deps

      # `continue-on-error` rather than a trailing `|| true`: the outcome is needed twice
      # below, and a swallowed exit code would report every week as green.
      - name: Read each suppression against its withdrawal condition
        id: expiry
        continue-on-error: true
        env:
          SUPPRESSION_REPORT: /tmp/suppression-expiry.md
        run: make suppression-expiry

      # Minted rather than using `GITHUB_TOKEN` for its rate limit; falls back when the app
      # is absent (README § PR コメント).
      - name: Mint a token for the issue
        id: api-token
        if: env.BASELINE_APP_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BASELINE_APP_ID }}
          private-key: ${{ secrets.BASELINE_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-contents: read

      # One issue for the subject, commented on while it stays open. A fresh issue each
      # week would bury the thread where the decision to keep or drop was argued.
      - name: Raise it where it has an owner
        if: ${{ steps.expiry.outcome == 'failure' }}
        uses: ./.github/actions/upsert-issue
        with:
          github-token: ${{ steps.api-token.outputs.token || secrets.GITHUB_TOKEN }}
          title: '[Suppression] 撤回条件を満たした抑止が残っている'
          body-file: /tmp/suppression-expiry.md
          label: chore

      - name: Fail if a condition is met
        if: ${{ steps.expiry.outcome == 'failure' }}
        run: exit 1

  # See README.md § 通知 (why only scheduled runs notify, and why cancelled counts).
  notify-failure:
    needs: suppression-expiry
    if: ${{ always() && github.event_name == 'schedule' && contains(fromJSON('["failure", "cancelled"]'), needs.suppression-expiry.result) }}
    uses: ./.github/workflows/notify.yaml
    with:
      failed-job: suppression-expiry
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
