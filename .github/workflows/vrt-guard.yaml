name: VRT Guard

# Re-runs the story comparison on a protected branch after a merge lands.
#
# In normal operation this never reports anything. Pull requests are judged against
# `refs/pull/N/merge` and the ruleset requires the branch to be up to date, so what
# merges is the tree that was already green. This job exists to catch the case where
# that premise breaks — a story that renders non-deterministically, a merge that
# bypassed the checks, a non-reproducible Storybook build.
#
# It deliberately does NOT retake baselines. Auto-accepting here would rewrite the
# truth for the one situation in which nobody looked at the pixels, which is exactly
# the situation the comparison exists to surface. A failure opens an issue instead.

on:
  push:
    branches:
      - production
      - staging
      - develop
      - 'release/**'
  workflow_dispatch:

# Select the CI environment file (env/.env.ci). Without this the loader falls back to
# `local`, which ships a placeholder session secret that the config layer refuses outside
# development. Storybook loads `next.config.ts` to build the preview, so the refusal lands
# there — and `storybook build` reports success anyway, leaving a tree with no preview.
env:
  APP_ENV: ci

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write

    # The app id is not a secret, and a step's `if` cannot read the `secrets` context —
    # only `env`. This is what lets the mint stand down on a fork that has no app.
    env:
      BASELINE_APP_ID: ${{ secrets.BASELINE_APP_ID }}

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            prod.app-api.stepsecurity.io:443
            mise-versions.jdx.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            fonts.googleapis.com:443
            fonts.gstatic.com:443
            mcr.microsoft.com:443
            *.data.mcr.microsoft.com:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Fetch the baseline images
        uses: ./.github/actions/setup-baselines
        with:
          app-id: ${{ secrets.BASELINE_APP_ID }}
          private-key: ${{ secrets.BASELINE_APP_PRIVATE_KEY }}

      - name: Setup mise and the pinned tools
        uses: ./.github/actions/setup-mise
        with:
          tools: core:node aqua:pnpm/pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        uses: ./.github/actions/setup-deps

      - name: Build Storybook and compare every story
        id: vrt
        continue-on-error: true
        shell: bash
        run: |
          set +e

          # Streamed for the same reason as `vrt.yaml`: a cancelled or timed-out run must
          # still leave a log behind.
          make vrt 2>&1 | tee /tmp/vrt-full.log
          code=${PIPESTATUS[0]}

          if [ "${code}" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      - name: Upload the visual diff
        if: ${{ !cancelled() && steps.vrt.outputs.status == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vrt-diff
          path: tmp/vrt
          retention-days: 30
          if-no-files-found: warn

      # One issue per branch, reopened rather than duplicated. A second failure on a
      # branch that is already flagged is the same unresolved fact, not a new one.
      #
      # `!= 'success'`, not `== 'failure'`: the comparison can fail to start at all — the
      # baseline store may be unreachable — and that has to raise too. `!cancelled()` is
      # what keeps a run superseded by the next merge out of that same net.
      - name: Compose what the issue says
        if: ${{ !cancelled() && steps.vrt.outputs.status != 'success' }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # The comparison may never have run — the baseline store can be unreachable. Raising
          # the issue matters more than the table, so every fallback ends in something
          # printable. **Which fallback fired decides how the evidence may be rendered**: the
          # table is this repository's own, while the log tail is whatever the tools printed
          # and must not become markup (ADR 0153 §5).
          kind=authored
          pnpm exec tsx scripts/vrt table tmp/vrt/report.json > /tmp/vrt-evidence.md 2>/dev/null ||
            : > /tmp/vrt-evidence.md

          if [ ! -s /tmp/vrt-evidence.md ]; then
            kind=tool-output
            tail -n 60 /tmp/vrt-full.log > /tmp/vrt-evidence.md 2>/dev/null ||
              : > /tmp/vrt-evidence.md
          fi

          if [ ! -s /tmp/vrt-evidence.md ]; then
            kind=authored
            echo '(比較そのものが実行できませんでした。実行ログを確認してください。)' > /tmp/vrt-evidence.md
          fi

          cat <<'NOTE' > /tmp/vrt-note.md
          マージ済みの木で差分が出ています。PR の判定はマージ結果に対して行われ、ブランチは最新である
          ことを要求しているため、通常ここは鳴りません。鳴ったということは前提のどれかが崩れています。

          - story の描画が決定的でない（撮るたび違う絵になる）
          - 検査を迂回したマージがあった
          - Storybook のビルドが再現しない

          **基準画像をそのまま撮り直さないでください。**誰も画素を見ていない状態を正にすることになります。
          NOTE

          # Degrades to a fixed body rather than failing: the step that raises the issue does
          # not gate on this one, so a failure here would file an empty issue (README.md,
          # "PR の外で落ちたら、issue にする").
          pnpm exec tsx scripts/ci-report issue-body \
            --kind "${kind}" \
            --evidence /tmp/vrt-evidence.md \
            --run-url "${RUN_URL}" \
            --note /tmp/vrt-note.md > /tmp/vrt-guard.md ||
            printf '%s\n\n実行: %s\n' '❌ 本文を組み立てられませんでした。実行ログを読んでください。' "${RUN_URL}" > /tmp/vrt-guard.md

      # Opening the issue runs on an app installation token rather than `GITHUB_TOKEN`,
      # whose 1,000 requests per hour are shared across every workflow and every open
      # pull request in this repository. A fork without the app falls back and still
      # opens the issue; it just draws on the smaller budget.
      - name: Mint a token for the issue
        id: api-token
        if: env.BASELINE_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BASELINE_APP_ID }}
          private-key: ${{ secrets.BASELINE_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-contents: read

      - name: Raise it where it has an owner
        if: ${{ !cancelled() && steps.vrt.outputs.status != 'success' }}
        uses: ./.github/actions/upsert-issue
        with:
          github-token: ${{ steps.api-token.outputs.token || secrets.GITHUB_TOKEN }}
          title: '[VRT] ${{ github.ref_name }} で基準画像と食い違いが出ている'
          body-file: /tmp/vrt-guard.md
          label: test

      - name: Fail if a story changed
        if: ${{ !cancelled() && steps.vrt.outputs.status != 'success' }}
        run: exit 1
