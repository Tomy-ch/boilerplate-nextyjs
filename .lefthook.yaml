# Git hook 設定。CI を権威とし、hook は「壊れた状態を CI に到達させない第一段」。
# 導入: pnpm install 後に `pnpm exec lefthook install` で .git/hooks に配置する。
#
# コマンドは素で書く。`mise exec` での包み込みは全面禁止。
# ツールは mise を activate した PATH から解決する前提。activate を経ない
# シェル (GUI クライアント / エージェント / CI) から起動して
# `❌ <tool> が PATH にありません` で落ちる場合は、包まずに shims を
# PATH へ載せて直す (`mise activate --shims`)。

pre-commit:
  parallel: true
  commands:
    lint:
      # `pnpm lint`（biome だけ）が通ってもここは落ちうる。続く ESLint と境界の突合がある。
      run: pnpm lint:ci
    md-lint:
      # Makefile 側も glob に入れるのは、skill-lint が make ターゲット一覧を検査入力に取るため
      # (ターゲットを消すだけのコミットでスキル本文の参照が腐る)。
      glob:
        - "*.md"
        - "Makefile"
        - ".makefiles/**/*.mk"
      run: pnpm lint:md
    test-cached:
      # キャッシュ付き。対象の TypeScript・設定・依存定義が変わるときだけ起動する。
      glob:
        - "**/*.{ts,tsx}"
        - "package.json"
        - "pnpm-lock.yaml"
        - "pnpm-workspace.yaml"
      run: make test-cached
    scripts-test-cached:
      # 1:1 ゲートは src / docs-viewer / tokens / mocks も走査するため、glob を scripts/ に絞らない。
      glob:
        - "**/*.{ts,tsx}"
        - "vitest.scripts.config.ts"
      run: make scripts-test-cached
    actionlint:
      # 検査が及ぶのは workflows だけだが、composite action の変更も呼び出し側の入力整合を
      # 壊すため発火対象に含める。
      glob:
        - ".github/workflows/*.{yml,yaml}"
        - ".github/actions/**/*.{yml,yaml}"
      run: make actionlint
    actions-shellcheck:
      # 検査ツール自身も glob に入れるのは、抽出が壊れれば「検査対象があるのに 0 件で緑」に
      # なりうるため。
      glob:
        - ".github/actions/**/*.{yml,yaml}"
        - "scripts/actions-shellcheck/*.ts"
        - "scripts/lib/*.ts"
      run: make actions-shellcheck
    actions-zizmor:
      # 抑止の宣言も発火対象に含める。設定が変われば所見の集合が変わる。
      glob:
        - ".github/workflows/*.{yml,yaml}"
        - ".github/actions/**/*.{yml,yaml}"
        - ".github/zizmor.yml"
      run: make actions-zizmor
    shellcheck:
      # 追跡下の単体シェル。TypeScript でも .github の中でもないので、他のどの網にも掛からない。
      glob: "**/*.sh"
      run: make shellcheck
    actions-comment-secret-lint:
      # 投稿ジョブの同定に action 定義の参照を辿るので、workflow だけでなく
      # .github/actions/** と共有モジュールの変更でも発火させる。
      glob:
        - ".github/workflows/*.{yml,yaml}"
        - ".github/actions/**/*.{yml,yaml}"
        - "scripts/actions-comment-secret-lint/*.ts"
        - "scripts/lib/*.ts"
      run: make actions-comment-secret-lint
    actions-required-check-lint:
      # 判定に要るのは workflow 定義と ruleset の宣言の 2 つで、どちらの変更でも発火させる。
      glob:
        - ".github/workflows/*.{yml,yaml}"
        - ".github/settings/branch-protection.json"
        - "scripts/required-check-lint/*.ts"
      run: make actions-required-check-lint
    api-gen-check:
      # CI は再生成して差分を見るが、hook は版の突合だけ。生成に数秒かかるのに対し、
      # 契約を取得したまま生成し忘れた状態はこの突合で捕まる。
      glob:
        - "openapi/**"
        - "src/adapters/gen/**"
        - "mocks/**"
        - "orval.config.ts"
      run: make api-gen-check
    actions-pin-check:
      # 下の egress-check / images-pin-check と合わせて、いずれもネットワークに出ないため
      # hook の速度目標に収まる。
      # glob を .github/** と広く取るのは、workflow 定義・composite action 定義・
      # ロックファイルの 3 か所いずれの変更でも発火させる必要があるため。
      glob: ".github/**"
      run: make actions-pin-check
    egress-check:
      # workflow 定義と宣言のどちらの変更でも発火させる。
      glob: ".github/**"
      run: make egress-check
    images-pin-check:
      # compose 定義・Dockerfile・ロックファイルのいずれの変更でも発火させる。
      # .github/** を含めるのは、workflow / composite action の `uses: docker://` も
      # この機構が digest 固定するため。
      glob:
        - "docker-compose*.{yml,yaml}"
        - "docker/**"
        - ".github/**"
      run: make images-pin-check

post-checkout:
  commands:
    baseline-sync:
      # ブランチを移っても git は基準画像の実体を動かさない。指し先と食い違ったまま残り、
      # その汚れを commit すると間違った指し先が保護ブランチへ載る。
      #
      # {3} はブランチの移動なら 1、ファイルの取り出しなら 0。後者では指し先が動かない。
      # 合わせる必要が無いことと、合わせに失敗したことを終了コードで分ける。
      run: if [ "{3}" = "1" ]; then make baseline-sync; fi

post-merge:
  commands:
    baseline-sync:
      # pull でも指し先だけが進む。移動と同じ理由でここでも合わせる。
      run: make baseline-sync

commit-msg:
  commands:
    commitlint:
      # {1} はクォートされずに展開されるため、パスに空白を含む clone でも壊れないよう囲む。
      run: make commitlint COMMIT_MSG_FILE="{1}"

pre-push:
  parallel: true
  commands:
    test-full:
      # キャッシュ無し。CI の完全実行と同じ挙動で、対象が変わるときだけ起動する。
      # gate-* 越しなので、帯が ci-first のときだけ CI へ委ねる（`make load-status`）。
      glob:
        - "**/*.{ts,tsx}"
        - "package.json"
        - "pnpm-lock.yaml"
        - "pnpm-workspace.yaml"
      run: make gate-test-full
    scripts-test:
      glob:
        - "**/*.{ts,tsx}"
        - "vitest.scripts.config.ts"
      run: make gate-scripts-test
    typecheck:
      run: make gate-typecheck
    secret-scan:
      # 依存脆弱性スキャン (make trivy-fs) をここに置かないのは、報告のみで落とさない検査だから。
      run: make secret-scan
