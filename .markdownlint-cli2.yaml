# ルール本体も対象範囲もこのファイルが持つ。別立ての .markdownlint.* を作らない。
config:
  MD013: false
  MD033: false
  MD041: false

globs:
  - "**/*.md"

# mermaid-lint の除外（scripts/lib/markdown-files.ts の EXCLUDE_DIRS / EXCLUDE_PREFIXES）と一致させる。
# 突合は scripts/markdown-exclusions.gate.test.ts が行うので、片方だけを直すと落ちる。
# skill-lint は走査の目的が別（リポジトリ全エントリを索引して参照を解決する）なので、一致は求めない。
# markdownlint-cli2 は既定で .gitignore を読まないため、ここに書かない限り対象に入る。
ignores:
  - "**/node_modules/**"
  - "**/.git/**"
  - ".claude/worktrees/**"
  - "graphify-out/**"
  - "storybook-static/**"
  - "tmp/**"
  - "docs/portal/guides/**"
  - "dist/**"
