# 開発を補助するツールのコンテナ。**配送物ではない** —— アプリ本体は `pnpm dev` でホスト実行する。
# 無印の `docker-compose.yml` を持たず、このファイルを名指しで起動する理由は docker/README.md が持つ。
services:
  # visual regression のランナー。ブラウザとフォントをイメージ側に持ち、リポジトリは
  # マウントで見せる。基準画像の一意性はこのイメージが担保するので、`image:` は tag では
  # なく digest で固定する (`make images-pin-check`)。
  #
  # `platform` を明示するのは、フォントのラスタライズが CPU アーキテクチャでも変わるため。
  # 省くと Apple Silicon が arm64、CI が amd64 を引き、基準画像が両者で一致しない。
  browser_runner:
    image: mcr.microsoft.com/playwright:v1.62.0-noble@sha256:baed2032d533817f3dbe6425de795788430ba345e819a1201337009ba17c9d07
    platform: linux/amd64
    # 生成物をホストの所有者で書き出す。root で書くと、撮った基準画像を撮った本人が
    # 消せない状態がリポジトリに残る。
    user: "${RUNNER_UID:-1000}:${RUNNER_GID:-1000}"
    working_dir: /app
    volumes:
      - .:/app
    environment:
      # 非 root で走るため、ブラウザが書ける HOME を与える。
      HOME: /tmp
    # Chromium は既定の 64MB の /dev/shm を使い切ってタブごと落ちる。
    ipc: host
    init: true
    entrypoint: []
    # 画面を通した検証（`make e2e`）はホストで起動したアプリへ当てる。`node_modules` は実行した
    # OS と CPU 向けに解決されるため、macOS で入れた木のままコンテナ内で `next start` を起動すると
    # linux 向けのネイティブモジュールが無く、その場で取りに行って失敗する。ブラウザとフォントを
    # 固定するのがこのイメージの役目であり、アプリの実行環境を固定するのは役目ではない。
    #
    # Docker Desktop はこの名前を自分で解決するが、Linux では明示しないと引けない。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 実行結果の HTML レポートを配る口。`make vrt-report` が --service-ports で
    # 明示したときだけ公開され、比較そのものの起動では開かない。
    ports:
      - "9323:9323"

  # 走っているアプリへ HTTP を撃つ検査（`make dast`）。ここだけが**ファイルではなく応答**を読む。
  #
  # 公式の `zaproxy/action-*` を使わないのは、あの action が受け取る `docker_name` が tag であって
  # digest ではないため。このリポジトリは container image を digest で固定し `make images-pin-check`
  # で突合する）が、action の input はその走査対象に入らない。
  # 固定したつもりで誰も検査していないピンが 1 つ増えるより、上の browser_runner と同じ形に揃える。
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
    platform: linux/amd64
    # browser_runner と違い `user:` を渡さない。ZAP は自分の add-on とセッションを
    # イメージ内の固定パスへ書くので、呼び出し側の uid で走らせると起動に失敗する
    # （実測: exit 3）。レポートは gitignore 済みの `tmp/dast` にだけ出る。
    working_dir: /zap/wrk
    volumes:
      - .:/zap/wrk
    # Docker Desktop はこの名前を自分で解決するが、Linux では明示しないと引けない。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: []
