[settings]
# pipx backend を uv（uvx）で解決する。実行系を mise 管理の uv に固定し、
# 実行者の環境に入っている pipx の差異を持ち込まない。
pipx.uvx = true

[tools]
# backend (`core:` / `aqua:` 等) は常に明示する。レジストリ上で複数 backend を持つツールは、
# 既定 backend が差し替わると取得元が黙って変わるため（判断は docs/adr/0003-version-manager.md）。
#
# pin は公開から配布経路ごとの冷却期間を置いて採る（make tools-cooldown-check）。窓の内側の版を
# 意図して採るときは pin の直上に `# tools-cooldown-ignore: <理由>。<窓が明ける日> に外す` を置く。
# 言語ランタイム（`core:`）は窓の対象外（scripts/tools-cooldown/README.md）。

# ランタイム / パッケージマネージャ
"core:node" = "24.14.1"
"aqua:pnpm/pnpm" = "10.33.0"

# GitHub Actions 定義の Lint（make actionlint）
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:zizmorcore/zizmor" = "1.29.0"

# セキュリティスキャナ（make secret-scan / make trivy-fs）
"aqua:gitleaks/gitleaks" = "8.30.1"
"aqua:aquasecurity/trivy" = "0.72.0"
"aqua:opengrep/opengrep" = "1.26.0"
"aqua:google/osv-scanner" = "2.4.0"
"aqua:Bearer/bearer" = "2.1.0"

# AI アシスタント向け
"aqua:astral-sh/uv" = "0.11.27"
# `graphify`（y 1 つ）は PyPI の空き名。綴りは必ず graphifyy
"pipx:graphifyy" = "0.9.25"

# 画面の実測（AI アシスタント向け）
"aqua:vercel-labs/agent-browser" = "0.34.0"
