# 取り込む契約の座標。`make api-fetch` がこの宣言に従って取得する。
#
# name / repo / path / ref は人が宣言する。sha / fetchedAt は取得時にスクリプトが
# 書き戻すため手で編集しない。取得物は `openapi/<name>.gen.yaml` に落ちる。
sources:
  # sample:begin
  # go-boilerplate 本体の API 契約。admin と一般が同居しており、tags でも security でも
  # scope でも機械的に分割できないため 1 ユニットとして扱う。
  - name: api
    repo: Tomy-ch/go-boilerplate
    path: openapi/openapi.gen.yaml
    # コミット SHA で固定する。商品 API も購入ステータスマスタも未タグの release ブランチにしか
    # なく、tag では指せない。上流の進展の取り込みはこの ref の書き換えとして明示的に行う。
    ref: 91cf355bcd4d806e81d08ccc367f88ac40de1179
    sha: 76e48258341218b16deaba772c2dd447f114b13e
    fetchedAt: 2026-09-04T19:25:56.960Z
  # sample:end
