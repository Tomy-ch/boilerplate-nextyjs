# client 側の資材の予算（[ADR 0101](docs/adr/0101-performance-budget.md)）。
#
# ## 何を測るか
#
# `next build` の出力にこれらの列は無いため、成果物（`.next`）の側から引く。route ごとに 4 つ。
#
# 初期 JS  route を開いたときに browser が最初に読む client JavaScript を gzip した合計。route
#          固有の chunk（その route が参照する client component）と共有 chunk（framework の
#          runtime）の和集合で、対応ブラウザが静的 route の HTML から読む script と一致する
# 遅延 JS  初期の chunk が読み込み器へ渡す chunk。`next/dynamic` の先がここに出る
# 合計 JS  初期と遅延の和。**その画面を使い切ると払う量**
# CSS      その route の entry が読む stylesheet
#
# **初期だけでは足りない。** 重いものを `next/dynamic` の先へ移すと初期は減るが、操作する人が
# 最終的に落とす量は変わらない。初期だけを見る予算はその変更を歓迎し、規約（`docs/rules.md`「性能」）
# の「`next/dynamic` は初期表示に不要で大きい client-only 機能に限る」を検査できない。合計を併せて
# 見ると、移しただけの変更が「初期が減り合計は変わらない」として現れる。
#
# **CSS を入れるのは、描画をブロックするため。** ADR 0101 が見ている Core Web Vitals のうち LCP に
# 直接効く。JS と同じ数字へ混ぜないのは、片方の悪化がもう片方の改善で消えるためである。
#
# polyfill は含めない。Next.js が `<script nomodule>` で出すため、ADR 0102 が対応対象とする
# ブラウザは取得しないからである。含めると、誰も読まない約 40 KB が全 route へ一律に乗る。
#
# ## 書き方
#
# routes.<route>.gzipKb    その route の**初期 JS** の上限（KB, gzip）。**宣言した route だけ**が
#                          上限で落ちる。宣言の無い route は表に出るだけで判定されない
# routes.<route>.reason    その値の根拠。空にできない（読み込み時に落ちる）
# growth.<量>.gzipKb       base ブランチからの増分の上限（KB, gzip）。**全 route に効く**。
#                          量は initialJs / totalJs / css の 3 つ
# growth.<量>.reason       同上
#
# 上限と増分は役割が違う。上限は総量の天井で、増分は「予算の余裕を小刻みに食い潰して、最後に
# 線を越えた PR だけが赤くなる」を防ぐ。宣言の無い route を守るのも増分の側である。
#
# **増分は変更 1 つぶんのラチェットであり、昇格の PR では判定に使わない。** 昇格（`release/*` を
# `production` / `staging` へ）の base は配信中のブランチで、そこへの差は個別に増分の判定を通った
# 変更の総和になる。変更 1 つぶんの幅をそこへ当てると、リリースの度に必ず割れる —— 緑にする唯一の
# 手が「増分の幅を広げる」になり、feature PR 側のラチェットまで一緒に壊れる。昇格では差を表に
# 出すだけにし、落とすのは宣言した上限だけにする（どの base で緩むかは
# `scripts/bundle-budget/budget.ts` の `growthModeFor` が持ち、テストが固定している）。
#
# したがって**昇格でリリース全体の総量を見張るのは routes の側**である。宣言を持たない route は
# 昇格では何にも当たらない。
#
# ## テンプレートから作った側へ
#
# **routes の値はこのリポジトリの同梱サンプルの実測であり、そのままでは意味を持たない。** 自分の
# アプリを build して測り直し、置き換えること（ADR 0101 は具体値をテンプレートから作った側の判断としている）。
# growth の値は用途に依らないため、そのまま使える。
#
# 同梱サンプルの route を宣言していないのは、サンプルが `make purge-sample` で消えるためである。
# 消える route の名前をここに残すと、破棄後のツリーに残留参照が生じる。

routes:
  "/_not-found":
    gzipKb: 180
    reason: 実測 164.0 KB に約 10% の余裕。共有 chunk の入れ替えで数 KB は動くため、その幅では鳴らさない
  "/_global-error":
    gzipKb: 161
    reason: 実測 146.0 KB に約 10% の余裕。client component をほぼ持たない下限に近い route である

growth:
  initialJs:
    # sample:replace-begin
    gzipKb: 30
    reason: >-
      依存の patch 更新や chunk の切り直しで数 KB は動くため、本来は 10 KB で足りる。30 KB へ広げて
      あるのは、route を器（app shell）の内と外で移すと、その route が器の client 島をまとめて背負う
      ためである。同梱サンプルではこれが 25 KB 前後で、器を持つ route と持たない route の差そのものに
      あたる。**この行はサンプルと一緒に消え、10 KB の側が残る** —— 作った側が器を 1 つに保つ限り、
      この段差は起きない
    # sample:replace-with
    # = gzipKb: 10
    # = reason: >-
    # =   依存の patch 更新や chunk の切り直しで数 KB は動くため、その幅では鳴らさない。器（app shell）
    # =   の内と外で route を移すと、その route が器の client 島をまとめて背負って 20 KB 台の段差が
    # =   出るが、器を 1 つに保つ限り起きない。**起こす変更をするなら、広げる前に器の側を見直す**
    # sample:replace-end
  totalJs:
    # sample:replace-begin
    gzipKb: 30
    # sample:replace-with
    # = gzipKb: 10
    # sample:replace-end
    reason: >-
      初期と同じ幅にしてある。合計は初期を含むので、初期が動く理由はそのまま合計にも効き、別の値に
      すると同じ 1 つの揺れで片方だけが鳴る。**この行が守っているのは「移しただけ」を通さないこと**
      で、`next/dynamic` の先へ寄せた変更は初期が減っても合計が動かないため、ここは静かなままになる
  css:
    gzipKb: 8
    # sample:replace-begin
    reason: >-
      utility CSS は部品が増えたぶんだけ増える種類の量で、動く幅が JS と桁で違う。JS と同じ 30 KB を
      置くと、この行は何も鳴らさない飾りになる。同梱サンプル全 route の CSS が 20 KB 前後なので、
      8 KB は「1 回の変更で 4 割増えた」に当たる
    # sample:replace-with
    # = reason: >-
    # =   utility CSS は部品が増えたぶんだけ増える種類の量で、JS とは増え方が違う。JS と同じ幅を
    # =   置くと、片方の揺れがもう片方の線を決めることになる。全 route の CSS が 20 KB 前後の規模で、
    # =   8 KB は「1 回の変更で 4 割増えた」に当たる
    # sample:replace-end

# ---------------------------------------------------------------------------------------
# Core Web Vitals の予算（同じ [ADR 0101](docs/adr/0101-performance-budget.md)）。
#
# ## 何を測るか
#
# `e2e/lib/screens.ts` が宣言する画面を 1 枚ずつ Lighthouse で開き、Core Web Vitals を測る。
# 開く画面の一覧をここで持ち直さないのは、持ち直すと画面を足した人が 2 箇所へ書くことになり、
# 片方だけを足した状態が「予算に収まっている」として緑で通るためである。
#
# 見るのは 3 つだけで、performance スコアは見ない。スコアは 5 指標の加重平均であり、下がった
# ときに**どれが下がったか**を答えられない。INP は実ユーザの操作を要して lab では測れないため、
# Lighthouse が lab の代替として置く TBT を見る（field 値の収集は ADR 0082）。
#
# 撮る条件は Lighthouse の既定（モバイル相当の画面 + CPU 4 倍の減速 + 低速回線の模擬）に任せる。
# 条件を緩めると上限だけがそのまま残り、通ることの意味が変わる。CLS と TBT は field の "good"
# 境界をそのまま置き、LCP はこの条件で測った床から導いてあるので、どちらも条件と対で意味を持つ。
#
# **同梱サンプルの画像には配信元（`MEDIA_ORIGIN`）が無い。** バックエンド側の object storage は
# CI に居ないため、`next/image` の最適化が取得に失敗する。ここで測れるのはアプリ自身が配るもの
# だけで、配信元が在るときの画像の重さは測れない（E2E が引くのと同じ線 —— `e2e/README.md`）。
#
# ## 書き方
#
# runs.count            1 画面あたりの試行回数。中央値を採る
# floor.screen          機械の速さを読むための画面の名前。**割った台すべてで測る**
# floor.reason          その画面を選んだ根拠。空にできない（読み込み時に落ちる）
# metrics.<指標>.limit  **全画面へ一律に効く**上限
# metrics.<指標>.reason その値の根拠。空にできない（読み込み時に落ちる）
# screens.<画面名>      その画面だけ既定を置き換える。指標は一部だけ書ける。**緩めるだけでなく
#                        締められる** —— 軽い画面を締めておくと、器や CSS の退行が、重い画面の
#                        振れに紛れる前に鳴る
#
# ## テンプレートから作った側へ
#
# **CLS の値は用途に依らない**（"good" の境界そのもの）。**LCP と TBT は lab の線で、この条件で
# 測った床から導く**（根拠は ADR 0101 §3）。field の LCP と INP は RUM が持つ（ADR 0082）。
#
# 画面ごとの置き換えは screens へ理由付きで書く。
#
# **締める側は、そのまま書いてよい。** 軽い画面を既定より締めるのは守る線を増やす向きである。
#
# **緩める側には手順がある**（ADR 0101 §3「上限を緩めるときの手順」）。緩めること自体は禁じて
# いないが、**落ちたときの第一選択肢にはしない** —— 先に §4 の書き方で削り切り、削り切れない
# 理由を機構の言葉で言い、見えるものを変える案も並べたうえで、**テックリード / アーキテクトの
# 確認を取ってから**書く。reason には、何が変われば下げられるのかも書く。
#
# **同梱サンプルに依存する行はマーカーで囲むこと**（このファイルでは YAML コメントとして書く）。
# screens の画面名は `sample:begin` / `sample:end`、サンプルのために広げた値とその `reason` は
# `sample:replace-*` で破棄後の姿と対にする。散文で「破棄したら戻すこと」と書くのでは足りない ——
# 予算は緩い側に倒れても鳴らないため、戻し忘れは腐っても誰にも分からない。

lighthouse:
  runs:
    count: 3
    reason: >-
      CI の runner は隣の仕事の影響で 1 回だけ極端に遅い試行を出す。中央値が意味を持つ最小の
      奇数が 3 で、偶数を避けるのは 2 つの平均がどの試行にも存在しない値になるためである。
      増やすほど安定するが、画面数だけ線形に伸びる
  floor:
    screen: not-found
    reason: >-
      **TBT は runner の速さがそのまま乗数として効く**（ADR 0101 §3）。その画面が遅いのか機械が
      遅いのかは、**同じ実行の床と見比べて**判別する。器も client 島もほぼ持たない `not-found` が
      その床で、重い画面と揃って動くことは 1 台構成の 10 実行で観測してある。
      **割ると床は 1 台にしか居ない。** 落ちた画面と床が別の機械で測られては見比べられないので、
      担当でない台でも測る。担当でない台の測定は**判定せず、報告にだけ出す** —— 同じ画面を台数
      ぶん判定すると、1 台でも遅い実行があるだけで落ちる。費用は 1 台あたり 1 画面ぶんの試行
  metrics:
    lcpMs:
      limit: 4500
      reason: >-
        **field の "good" 境界（2.5 秒）ではなく、この条件で測った lab の線**（根拠は ADR 0101 §3）。
        内訳は 2.2 秒（床。`not-found` の実測）+ 0.7 秒（同じ画面が実行をまたいで動いた最大幅）
        + 1.6 秒（アプリへ割り当てる分）。3 回の中央値は 1 回だけ遅い試行を消すが、runner ごと
        遅い実行は消せず、そのとき全画面が揃って動くため、振れを織り込まないと退行と見分けが付かない
    clsScore:
      limit: 0.1
      reason: >-
        Core Web Vitals が CLS を "good" と定める境界（0.1）そのもの。用途で動く値ではない
    tbtMs:
      limit: 350
      reason: >-
        **INP の "good" 境界（200 ms）ではなく、この条件で測った lab の線**（LCP と同じ導き方。
        根拠は ADR 0101 §3）。TBT は main thread を塞いだ時間なので、**runner の速さがそのまま
        乗数として効く**。内訳は 76 ms（床。`not-found` の実測の高い側。低い側は 42 ms）
        + 176 ms（同じ画面が実行をまたいで動いた最大幅。49 → 225 ms）+ 100 ms（アプリへ割り当てる
        分）。同梱サンプルで最も多くの client 島を hydration する画面の実測（3 実行の中央値
        92 / 179 / 234 ms、単発では 89〜252 ms）がこの線の内側に収まる。
        **200 ms を置くと、超える画面が実行ごとに入れ替わる** —— 超えた画面はいずれも別の実行では
        半分以下で、重くなった理由がどれにも無い。それは画面の重さではなく機械の速さを判定している。
        **下げられる条件**: 割った台ごとに床を測る仕組み（`floor`）が報告だけでなく補正に使われ、
        機械の速さを割り戻せるようになったとき。床は台ごとに測れているので、残るのは判定の側だけである。
        **軽い画面を TBT で締めた行を置いていないのは、締める先が床そのものだからである** ——
        LCP と違って TBT は乗数が支配的で、器しか持たない画面ほど機械の速さを素直に写す。
        そこへ細い線を引くと、遅い実行のたびに床が鳴り、床を見て判別するという役目を失う
  screens:
    # 破棄後も残る画面。既定より締めてある。
    not-found:
      lcpMs:
        limit: 2800
        reason: >-
          器も client 島もほぼ持たない画面。「書き方」の `screens` が言う理由で既定より締める ——
          重い画面ほど振れるため、一律の上限だけでは床の悪化を捕まえられない。実測は 3 実行で
          1.91 / 2.35 / 2.36 秒。**床そのものが 0.45 秒振れるので、ここはこれ以上締めきれない**
          —— 下げると、機械が速い回にだけ通る線になる
    login:
      lcpMs:
        limit: 3300
        reason: >-
          `not-found` と同じ理由で締める。実測 2.83 / 2.84 / 2.86 秒に約 0.4 秒。
          **上限を置いた時点の実測（2.49 / 2.63 秒）から 0.2 秒ほど上がっており、しかも振れて
          いない**（3 実行で 0.03 秒）。床は同じ 3 実行で 1.91〜2.36 秒と振れているので、機械の
          速さでは説明が付かない —— **この 0.2 秒の出所は特定できていない。**
          `dev-session` が同じ幅だけ同じように上がっているため、2 つが共有する経路を疑っている。
          この値は現状の追認であり、原因が分かれば下げる
    dev-session:
      lcpMs:
        limit: 3300
        reason: >-
          `not-found` と同じ理由で締める。実測 2.69 / 2.80 / 2.83 秒に約 0.4 秒。上限を置いた
          時点（2.47 / 2.61 秒）からの上がり方も、振れていないことも `login` と同じ
    # sample:begin
    admin-product-edit:
      lcpMs:
        limit: 5300
        reason: >-
          実測 2.66 / 3.45 / 4.87 秒。**振れ 2.21 秒は、既定の上限が織り込む 0.7 秒の 3 倍**で、
          この画面だけが既定の導出の前提から外れている。同じ 3 実行で床は 1.91〜2.36 秒しか
          動いておらず、機械が遅かったのでは説明が付かない。値は同じ理由を持つ
          products / profile-edit へ揃えた。
          **振れの原因は特定できていない。** 床（`floor`）が報告だけでなく判定の補正に使われ、
          台ごとの速さを割り戻せるようになれば下げられる
    product-detail:
      lcpMs:
        limit: 4800
        reason: >-
          実測 2.92 / 3.80 / 3.97 秒。**振れ 1.05 秒が既定の上限の余裕 0.70 秒を上回っており**、
          既定のままでは実測が悪化しなくても、いずれ振れだけで落ちる。値は上の側（3.97 秒）へ
          0.8 秒ほどを足したもので、`admin-product-edit` ほど広げていないのは振れが半分だから
          である。下げられる条件は `admin-product-edit` と同じ
    products:
      lcpMs:
        limit: 5300
        reason: >-
          同梱サンプルで最も遅い画面。実測 4.03 / 4.66 秒に、この画面で観測した振れ（0.63 秒）を
          足した値。一覧は画像を並べるが、CI には配信元が無いため、ここで測れているのはアプリが
          配るぶんだけである
    profile-edit:
      lcpMs:
        limit: 5300
        reason: >-
          実測 3.84 / 4.56 秒で、振れも最大の 0.72 秒だった。**遅さの原因は特定できていない。**
          この値は現状の追認であり、原因が分かれば下げる
      tbtMs:
        limit: 430
        reason: >-
          実測 96 / 98 / 251 ms。**振れ 155 ms が既定（350 ms）の余裕 99 ms を上回る** ——
          3 実行のうち 1 回だけ 2.5 倍へ跳ね、跳ねた回でも他の画面は既定の内側に居た。
          既定の 350 ms はこの画面の実測から導かれている（`metrics.tbtMs` の reason）ので、
          この画面が跳ねると既定そのものが根拠を失う。値は最悪の実測（251 ms）へ、既定が
          すでに宣言している振れ幅（176 ms）を足した 427 ms の丸め。
          **跳ねる原因は特定できていない。** 床（`floor`）が判定の補正に使われれば下げられる
    # sample:end
