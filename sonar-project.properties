# S5144「要求から来た値で URL を組むな」。**この口は自分の外へ出て行かない。** 届いた要求を
# `fetch` へ渡すのは、MSW が socket へ出る前に掴んで応答を作るためで、掴まれなかったものは
# `onUnhandledRequest: "error"` で落ちて 502 になる —— 素通しの経路が無いので、どこへも接続しない。
# 宛先の host はテンプレートで**この口自身の待ち受け先**に固定してあり、要求から来るのは path と
# query だけである（proxy 形式の要求行が来ると URL として組めず、同じく 502 へ落ちる）。
# そもそもこのファイルは配信物に入らない —— `pnpm build` が `APP_API_MODE=mock` のときだけ立てて、
# `next build` が終われば閉じる（[mocks/README.md](mocks/README.md)）。
#
# 撤回条件: この口が**自分以外の host** へ中継するようになったとき。そこは抑止ではなく、宛先を
# 固定する先になる。
sonar.issue.ignore.multicriteria.e33.ruleKey=tssecurity:S5144
sonar.issue.ignore.multicriteria.e33.resourceKey=mocks/serve.ts

