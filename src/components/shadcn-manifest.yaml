# shadcn/ui 由来の component の来歴を記録する台帳。
#
# 対象は `src/components` 配下のすべての役割で、`README.md` を持つディレクトリが component。
# 記録の追加・確認は `pnpm add:ui` / `pnpm check:ui` が行う。詳細は scripts/README.md を正とする。
#
#   key           実体を指すラベル。原則ディレクトリ名。衝突する場合だけ修飾する
#   registryItem  上流の item 名。`original` は上流を持たないため書かない
#   dependencies  実装が実際に import している外部 package。参照が無ければ書かない
#   directory     実体の置き場所。名前から推測しないためこれが正
#   kind          copy-in = 要追従 / reimplemented = 参考 / original = 上流なし /
#                 not-adopted = 検討したうえで作らない
#   as            component 目録で載る見出し。目的を表す
#
# `not-adopted` は実体を持たないため `layer` / `as` / `directory` を書かず、代わりに `reason` と
# `revisitWhen` を必須にする。**条件を書けない「やらない」は判断ではなく先送りである。**
# ここに残すのは「検討したのか、まだ見ていないのか」を後から区別できるようにするためで、
# 責務を引き取った component がある場合はその README が決定の実体を持つ。
#
# `as` と `directory` を 1 つに畳まないこと。`as` は目的、`directory` は層と置き場所で、軸が違う。
# `ui/pagination` と `navigation/cursor-pagination` はどちらも `as: navigation` であり、
# 基底か合成かは `directory` だけが持つ。
#
# key と registryItem を 1 つに畳まないこと。同じ item から native / client の 2 実装を
# 作った場合に表現できなくなる。
