  # ここから下は実体を持たない `not-adopted`。`as` を持たないため上の目的別の並びに入らない。
  async-operation-state:
    kind: not-adopted
    reason: >-
      列挙した項目すべてに既存の owner がある。pending は ADR 0061 の `useFormStatus`、retry は
      `ApiErrorAlert`、undo と完了通知は `Toaster` の `ToastAction`、cancel は ADR 0071 の
      `AbortSignal` が持つ。中核の optimistic update は client hook であり、`components` は
      `capabilities` を import できないため、この層には置けない。
    revisitWhen: >-
      form 送信を経由しない非同期操作が複数画面に現れ、pending 表示と二重操作抑止の形が feature
      ごとに割れ始めたとき。その場合も置き場は `components` ではなく `capabilities` の hook になる。
    decidedAt: 2026-08-05T00:00:00.000Z
